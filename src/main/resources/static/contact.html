<!doctype html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/obsidian/obsidian-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/obsidian/obsidian-512.png" />
    <link rel="apple-touch-icon" href="/assets/images/obsidian/obsidian-192.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ObsidianScout | Contact</title>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="manifest" href="/manifest.json" />
    <style>
        .contact-card {
            max-width: 600px;
            margin: 24px auto 0 auto;
        }
        .form-grid {
            display: grid;
            gap: 20px;
        }
        .spinner-inline {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Make disabled input look read-only and premium */
        input:disabled, select:disabled, textarea:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            background: rgba(255, 255, 255, 0.03);
        }

        /* Public Guest Header Styles */
        .contact-public-header {
            display: none;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            align-items: center;
            justify-content: space-between;
        }

        body.theme-dark .contact-public-header {
            background: rgba(11, 15, 25, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        body.is-guest .contact-public-header {
            display: flex;
        }

        body.is-guest .sidebar {
            display: none !important;
        }

        body.is-guest .mobile-topbar {
            display: none !important;
        }

        body.is-guest .sidebar-overlay {
            display: none !important;
        }

        body.is-guest .app-shell {
            display: block;
        }

        body.is-guest .main-content {
            max-width: 1240px;
            margin: 0 auto;
            padding: 24px 24px 80px;
        }

        @media (max-width: 768px) {
            .contact-public-header {
                padding: 10px 16px;
                gap: 12px;
            }
            .header-nav {
                display: none;
            }
            .header-brand span {
                font-size: 1rem;
            }
            .btn-signin, .btn-primary-action {
                padding: 6px 12px;
                font-size: 12.5px;
            }
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--ink);
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.01em;
        }

        .header-brand img {
            width: 28px;
            height: 28px;
            border-radius: 6px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-nav a.nav-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.15s ease;
        }

        .header-nav a.nav-link:hover,
        .header-nav a.nav-link.active {
            color: var(--ink);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-signin {
            color: var(--ink);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            transition: all 0.15s ease;
        }

        .btn-signin:hover {
            background: var(--surface-3);
            color: var(--ink);
            border-color: var(--border-focus);
        }

        .btn-primary-action {
            background: var(--accent);
            color: #ffffff;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 10px var(--accent-glow);
        }

        .btn-primary-action:hover {
            background: #1d4ed8;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--ink);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 0;
            flex-shrink: 0;
        }

        .btn-theme-toggle:hover {
            background: var(--surface-3);
            border-color: var(--border-focus);
        }
    </style>
</head>
<body data-page="contact" class="is-guest">
    <script>
        (function() {
            try {
                const saved = localStorage.getItem("obsidian-theme") || "light";
                if (saved === "dark") {
                    document.body.classList.add("theme-dark");
                }
                const cachedUser = localStorage.getItem("cache:/api/auth/me");
                if (cachedUser) {
                    document.body.classList.remove("is-guest");
                }
            } catch (e) {
                console.warn("Theme/auth storage access failed:", e);
            }
        })();
    </script>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Public Header shown when user is not signed in -->
    <header class="contact-public-header" id="contact-public-header">
        <a href="/" class="header-brand">
            <img src="/assets/images/obsidian/obsidian-192.png" alt="ObsidianScout Logo" />
            <span>ObsidianScout</span>
        </a>
        <nav class="header-nav">
            <a href="/#platforms" class="nav-link">Platforms</a>
            <a href="/#abilities" class="nav-link">Capabilities</a>
            <a href="/#roles" class="nav-link">Roles</a>
            <a href="/docs" class="nav-link">Docs</a>
            <a href="/contact" class="nav-link active">Contact</a>
        </nav>
        <div class="header-actions">
            <button class="btn-theme-toggle" data-action="toggle-theme" type="button" aria-label="Toggle Theme">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
            <a href="/login" class="btn-signin">Sign In</a>
            <a href="/login?mode=register" class="btn-primary-action">Get Started</a>
        </div>
    </header>

    <div class="app-shell">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="card">
                <h1 data-i18n="contact.title">Contact Us</h1>
                <p class="notice" data-i18n="contact.notice">Submit a bug report, feature request, or general feedback.</p>
            </div>

            <div class="card contact-card">
                <form id="contact-form" class="form-grid">
                    <div class="field">
                        <label for="contact-name" data-i18n="contact.label.name">Your Name</label>
                        <input id="contact-name" type="text" required />
                    </div>

                    <div class="field">
                        <label for="contact-email" data-i18n="contact.label.email">Reply-To Email Address</label>
                        <input id="contact-email" type="email" required />
                    </div>

                    <div class="field">
                        <label for="contact-team" data-i18n="contact.label.team">Team Number</label>
                        <input id="contact-team" type="text" readonly disabled />
                    </div>

                    <div class="field">
                        <label for="contact-type" data-i18n="contact.label.type">Submission Type</label>
                        <select id="contact-type" required>
                            <option value="BUG_REPORT" data-i18n="contact.type.bug_report">Bug Report</option>
                            <option value="FEATURE_REQUEST" data-i18n="contact.type.feature_request">Feature Request</option>
                            <option value="OTHER" data-i18n="contact.type.other">Other</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="contact-message" data-i18n="contact.label.message">Message</label>
                        <textarea id="contact-message" rows="8" required data-i18n-placeholder="contact.placeholder.message" placeholder="Please describe your bug, feature request, or feedback here..."></textarea>
                    </div>

                    <button id="contact-submit-btn" class="btn primary" type="submit" style="display: flex; justify-content: center; align-items: center; gap: 8px;">
                        <span id="btn-text" data-i18n="contact.btn.send">Send Message</span>
                        <div class="spinner-inline" id="submit-spinner"></div>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script type="module" src="/js/common.js"></script>
    <script defer src="/js/contact.js"></script>
</body>
</html>
