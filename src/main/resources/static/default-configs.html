<!doctype html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/obsidian/obsidian-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/obsidian/obsidian-512.png" />
    <link class="apple-touch-icon" href="/assets/images/obsidian/obsidian-192.png" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ObsidianScout | Manage Default Configs</title>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="manifest" href="/manifest.json" />

    <style>
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .preset-card {
            background: var(--card-bg, var(--surface-1, #1e1e2d));
            border: 1px solid var(--border, rgba(255, 255, 255, 0.1));
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .preset-card:hover {
            border-color: var(--accent, #6366f1);
            transform: translateY(-2px);
        }
        .preset-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 12px;
        }
        .preset-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--ink);
            margin: 0;
        }
        .preset-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-frc { background: rgba(239, 68, 68, 0.12); color: #dc2626; border: 1px solid rgba(239, 68, 68, 0.25); }
        .badge-ftc { background: rgba(59, 130, 246, 0.12); color: #2563eb; border: 1px solid rgba(59, 130, 246, 0.25); }
        .badge-type { background: rgba(168, 85, 247, 0.12); color: #9333ea; border: 1px solid rgba(168, 85, 247, 0.25); margin-left: 6px; }
        .badge-active { background: rgba(34, 197, 94, 0.12); color: #16a34a; border: 1px solid rgba(34, 197, 94, 0.25); margin-left: 6px; }
        
        body.theme-dark .badge-frc { background: rgba(239, 68, 68, 0.2); color: #f87171; border-color: rgba(239, 68, 68, 0.4); }
        body.theme-dark .badge-ftc { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border-color: rgba(59, 130, 246, 0.4); }
        body.theme-dark .badge-type { background: rgba(168, 85, 247, 0.2); color: #c084fc; border-color: rgba(168, 85, 247, 0.4); }
        body.theme-dark .badge-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; border-color: rgba(34, 197, 94, 0.4); }

        .preset-meta {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 16px;
        }
        .preset-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .filter-bar {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
            background: var(--surface-1);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Editor Tabs */
        .editor-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        .editor-tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--muted);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .editor-tab-btn:hover {
            color: var(--ink);
            background: var(--surface-2);
        }
        .editor-tab-btn.active {
            color: var(--accent);
            background: var(--surface-2);
            border-color: var(--accent);
        }

        /* Visual Field Cards */
        .visual-field-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .visual-field-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .visual-field-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
        }

        .json-editor {
            width: 100%;
            height: 320px;
            font-family: monospace;
            font-size: 0.9rem;
            background: var(--surface-2);
            color: var(--ink);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            resize: vertical;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: var(--card-bg, var(--surface-1));
            color: var(--ink);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 920px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .hidden { display: none !important; }

        /* Options builder styling */
        .options-builder {
            background: var(--surface-1);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-top: 8px;
        }
        .options-builder-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .options-builder-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--ink);
        }
        .options-builder-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option-item-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .option-item-row input[type="text"] {
            flex: 2;
        }
        .option-item-row input[type="number"] {
            flex: 1;
            max-width: 110px;
        }
    </style>
</head>

<body data-page="default-configs">
    <script>
        (function() {
            try {
                const saved = localStorage.getItem("obsidian-theme") || "light";
                if (saved === "dark") {
                    document.body.classList.add("theme-dark");
                }
            } catch (e) {
                console.warn("Theme storage access failed:", e);
            }
        })();
    </script>

    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="app-shell">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 20px;">
                    <div>
                        <h1 style="margin: 0;">Default Configs Manager</h1>
                        <p class="notice" style="margin-top: 4px;">Create, edit, and set system default configurations for FTC and FRC teams.</p>
                    </div>
                    <button id="btn-create-preset" class="btn primary" type="button">+ Create New Default Preset</button>
                </div>

                <div class="filter-bar">
                    <div class="filter-group">
                        <label for="filter-program"><strong>Program:</strong></label>
                        <select id="filter-program" class="input" style="width: auto;">
                            <option value="ALL">All Programs</option>
                            <option value="FTC">FTC</option>
                            <option value="FRC">FRC</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filter-type"><strong>Type:</strong></label>
                        <select id="filter-type" class="input" style="width: auto;">
                            <option value="ALL">All Types</option>
                            <option value="match">Match</option>
                            <option value="pit">Pit</option>
                            <option value="qualitative">Qualitative</option>
                        </select>
                    </div>
                    <div style="margin-left: auto;">
                        <span id="preset-count" class="badge">0 presets</span>
                    </div>
                </div>

                <div id="preset-list" class="preset-grid"></div>
            </div>
        </main>
    </div>

    <!-- Modal for Creating/Editing Default Config Preset -->
    <div id="preset-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-top: 0;">Create Default Config Preset</h2>

            <form id="preset-form">
                <input type="hidden" id="preset-id" />

                <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px;">
                    <div class="field">
                        <label for="preset-name">Preset Name</label>
                        <input type="text" id="preset-name" class="input" placeholder="e.g. ftc2026, frc2026" required />
                    </div>

                    <div class="field">
                        <label for="preset-program">Program</label>
                        <select id="preset-program" class="input" required>
                            <option value="FTC">FTC</option>
                            <option value="FRC">FRC</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="preset-type">Config Type</label>
                        <select id="preset-type" class="input" required>
                            <option value="match">Match</option>
                            <option value="pit">Pit</option>
                            <option value="qualitative">Qualitative</option>
                        </select>
                    </div>
                </div>

                <div class="field" style="margin-bottom: 16px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="preset-is-default" />
                        <span><strong>Set as Active Default</strong> for this Program and Type</span>
                    </label>
                </div>

                <!-- Live editing status (filled by config-collab.js) -->
                <div id="preset-collab-status"></div>

                <!-- Editor Sub-Tabs -->
                <div class="editor-tabs">
                    <button type="button" id="tab-visual" class="editor-tab-btn active"><i class="fa-solid fa-bolt"></i> Simple / Visual Editor</button>
                    <button type="button" id="tab-raw" class="editor-tab-btn">{ } Raw JSON Editor</button>
                </div>

                <!-- Container 1: Visual Field Builder -->
                <div id="visual-editor-container" style="margin-bottom: 20px;">
                    <div class="form-grid" style="grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 16px;">
                        <div class="field">
                            <label for="config-title">Scouting Title</label>
                            <input type="text" id="config-title" class="input" placeholder="e.g. FTC 2026 Into The Deep Scouting" />
                        </div>
                        <div class="field">
                            <label for="config-version">Version</label>
                            <input type="number" id="config-version" class="input" value="1" min="1" />
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <h4 style="margin: 0; font-size: 0.95rem; color: var(--ink);">Scouting Fields & Sections</h4>
                        <button type="button" id="btn-add-field" class="btn ghost btn-sm">+ Add Field</button>
                    </div>

                    <div id="visual-fields-list"></div>
                </div>

                <!-- Container 2: Raw JSON Editor -->
                <div id="raw-editor-container" class="field hidden" style="margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label for="preset-json" style="margin: 0;">Configuration JSON</label>
                        <button type="button" id="btn-format-json" class="btn ghost btn-sm">Format JSON</button>
                    </div>
                    <textarea id="preset-json" class="json-editor" placeholder="{ &quot;title&quot;: &quot;...&quot;, &quot;fields&quot;: [] }"></textarea>
                    <div id="json-error" style="color: #ef4444; font-size: 0.85rem; margin-top: 6px; display: none;"></div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid var(--border); padding-top: 16px;">
                    <button type="button" id="btn-cancel-modal" class="btn ghost">Cancel</button>
                    <button type="submit" id="btn-save-modal" class="btn primary">Save Preset</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/js/common.js"></script>
    <script src="/js/utilities/config-duplicates.js"></script>
    <script src="/js/services/config-collab.js"></script>
    <script>
        let allPresets = [];
        let currentPresetConfig = { title: "", version: 1, fields: [], analytics: [] };
        let activeEditorTab = "visual"; // "visual" or "raw"

        async function loadPresets() {
            try {
                const res = await fetch('/api/admin/default-configs');
                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) {
                        alert('You must be a site admin to manage default configs.');
                        window.location.href = '/admin-settings';
                        return;
                    }
                    throw new Error('Failed to fetch presets');
                }
                allPresets = await res.json();
                renderPresets();
            } catch (err) {
                console.error(err);
                document.getElementById('preset-list').innerHTML = `<p class="notice" style="color:#ef4444;">Error loading default configs: ${err.message}</p>`;
            }
        }

        function renderPresets() {
            const progFilter = document.getElementById('filter-program').value;
            const typeFilter = document.getElementById('filter-type').value;

            const filtered = allPresets.filter(p => {
                const matchProg = progFilter === 'ALL' || p.program === progFilter;
                const matchType = typeFilter === 'ALL' || p.configType.toLowerCase() === typeFilter.toLowerCase();
                return matchProg && matchType;
            });

            document.getElementById('preset-count').textContent = `${filtered.length} preset${filtered.length === 1 ? '' : 's'}`;

            const container = document.getElementById('preset-list');
            if (filtered.length === 0) {
                if (allPresets.length === 0) {
                    container.innerHTML = `<div class="card soft" style="grid-column: 1/-1; text-align: center; padding: 40px;"><p class="notice" style="font-size: 1.05rem;">No default config presets exist yet. All default configurations are manually created.<br><br><button class="btn primary" onclick="openModal()">+ Create Your First Preset</button></p></div>`;
                } else {
                    container.innerHTML = `<div class="card soft" style="grid-column: 1/-1; text-align: center; padding: 40px;"><p class="notice">No default config presets match your filters.</p></div>`;
                }
                return;
            }

            container.innerHTML = filtered.map(p => {
                const progBadge = p.program === 'FTC' ? 'badge-ftc' : 'badge-frc';
                const defaultBadge = p.isDefault ? `<span class="preset-badge badge-active">Active Default</span>` : '';
                return `
                    <div class="preset-card">
                        <div>
                            <div class="preset-header">
                                <h3 class="preset-title">${escapeHtml(p.name)}</h3>
                                <div>
                                    <span class="preset-badge ${progBadge}">${escapeHtml(p.program)}</span>
                                    <span class="preset-badge badge-type">${escapeHtml(p.configType)}</span>
                                    ${defaultBadge}
                                </div>
                            </div>
                            <div class="preset-meta">
                                Modified: ${p.updatedAt ? new Date(p.updatedAt).toLocaleDateString() : 'N/A'}
                            </div>
                        </div>
                        <div class="preset-actions">
                            ${!p.isDefault ? `<button class="btn ghost btn-sm" style="color:var(--accent); font-weight:600;" onclick="setActivePreset('${p.id}')"><i class="fa-solid fa-star"></i> Set Active</button>` : ''}
                            <button class="btn ghost btn-sm" onclick="editPreset('${p.id}')">Edit</button>
                            <button class="btn ghost btn-sm" onclick="duplicatePreset('${p.id}')">Duplicate</button>
                            <button class="btn ghost btn-sm" style="color:#ef4444;" onclick="deletePreset('${p.id}', '${escapeHtml(p.name)}')">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        /* --- Visual Field Builder Logic --- */
        function switchEditorTab(tab) {
            activeEditorTab = tab;
            const tabVisual = document.getElementById('tab-visual');
            const tabRaw = document.getElementById('tab-raw');
            const containerVisual = document.getElementById('visual-editor-container');
            const containerRaw = document.getElementById('raw-editor-container');
            const jsonError = document.getElementById('json-error');

            jsonError.style.display = 'none';

            if (tab === 'visual') {
                const rawText = document.getElementById('preset-json').value.trim();
                try {
                    if (rawText && presetCollab) {
                        JSON.parse(rawText);
                        commitPresetRaw();
                        currentPresetConfig = JSON.parse(JSON.stringify(presetCollab.lastView.doc));
                        document.getElementById('config-title').value = currentPresetConfig.title || '';
                        document.getElementById('config-version').value = currentPresetConfig.version || 1;
                    } else if (rawText) {
                        const parsed = JSON.parse(rawText);
                        currentPresetConfig = parsed;
                        if (!currentPresetConfig.fields) currentPresetConfig.fields = [];
                        document.getElementById('config-title').value = currentPresetConfig.title || '';
                        document.getElementById('config-version').value = currentPresetConfig.version || 1;
                    }
                } catch (e) {
                    alert(`Raw JSON has errors. Please fix syntax before switching to Simple Editor: ${e.message}`);
                    return;
                }
                renderVisualFields();
                tabRaw.classList.remove('active');
                tabVisual.classList.add('active');
                containerRaw.classList.add('hidden');
                containerVisual.classList.remove('hidden');
            } else {
                updateRawFromVisual();
                tabVisual.classList.remove('active');
                tabRaw.classList.add('active');
                containerVisual.classList.add('hidden');
                containerRaw.classList.remove('hidden');
            }
        }

        function supportsPointsConfig() {
            const configType = document.getElementById('preset-type')?.value || 'match';
            return configType === 'match';
        }

        function supportsPhasesConfig() {
            const configType = document.getElementById('preset-type')?.value || 'match';
            return configType === 'match';
        }

        function canonicalizePresetFieldType(rawType) {
            if (!rawType) return "text";
            const t = String(rawType).toLowerCase().trim();
            if (t === "counter") return "counter";
            if (t === "number" || t === "int" || t === "integer" || t === "float") return "number";
            if (t === "rating" || t === "stars" || t === "star") return "rating";
            if (t === "checkbox" || t === "toggle" || t === "bool" || t === "boolean") return "checkbox";
            if (t === "select" || t === "dropdown" || t === "choice") return "select";
            if (t === "section" || t === "section_header" || t === "header") return "section";
            if (t === "textarea" || t === "notes" || t === "note" || t === "paragraph") return "textarea";
            if (t === "text" || t === "static" || t === "label") return "text";
            if (t === "image" || t === "photo" || t === "image_upload") return "image";
            return t;
        }

        function cleanPresetConfigForSave(raw) {
            const usedIds = new Set((raw.fields || []).map(f => f.id).filter(Boolean));
            const cleanedFields = (raw.fields || []).map(f => {
                const fieldId = f.id || newFieldId(usedIds);
                usedIds.add(fieldId);
                return cleanPresetField({ ...f, id: fieldId });
            });

            return {
                title: (document.getElementById('config-title')?.value || raw.title || "ObsidianScout").trim(),
                version: Number(document.getElementById('config-version')?.value || raw.version || 1),
                fields: cleanedFields,
                analytics: raw.analytics || []
            };
        }

        /** One field as the editor saves it (also how live edits are compared, so untouched fields never diff). */
        function cleanPresetField(f) {
            const supportsPts = supportsPointsConfig();
            const supportsPhs = supportsPhasesConfig();
            const canonicalType = canonicalizePresetFieldType(f.type);
            const cleaned = {
                id: f.id || '',
                label: typeof f.label === 'object' && f.label !== null ? (f.label.en || Object.values(f.label)[0] || '') : (f.label || ''),
                type: canonicalType
            };
            if (canonicalType !== 'text' && canonicalType !== 'section') {
                cleaned.required = !!f.required;
            }
            if (supportsPhs) {
                cleaned.phase = f.phase || 'teleop';
            }
            if (canonicalType === 'number' || canonicalType === 'counter' || canonicalType === 'rating') {
                if (f.min !== undefined && f.min !== null && f.min !== '') cleaned.min = Number(f.min);
                if (f.max !== undefined && f.max !== null && f.max !== '') cleaned.max = Number(f.max);
                if (f.step !== undefined && f.step !== null && f.step !== '') cleaned.step = Number(f.step);
                const dStep = f.doubleStep !== undefined ? f.doubleStep : f.double_step;
                if (dStep !== undefined && dStep !== null && dStep !== '') cleaned.doubleStep = Number(dStep);
            }
            if (supportsPts && (canonicalType === 'number' || canonicalType === 'counter' || canonicalType === 'rating' || canonicalType === 'checkbox')) {
                if (f.pointsPer !== undefined && f.pointsPer !== null && f.pointsPer !== '') {
                    cleaned.pointsPer = Number(f.pointsPer);
                }
            }
            if (canonicalType === 'select') {
                cleaned.options = (f.options || []).map(opt => ({
                    label: typeof opt.label === 'object' && opt.label !== null ? (opt.label.en || Object.values(opt.label)[0] || '') : (opt.label || ''),
                    value: opt.value ? String(opt.value).trim() : (typeof opt.label === 'string' ? opt.label.trim() : ''),
                    ...(supportsPts ? { points: opt.points !== undefined && opt.points !== null && opt.points !== '' ? Number(opt.points) : 0 } : {})
                }));
            }
            return cleaned;
        }

        function updateRawFromVisual() {
            currentPresetConfig = cleanPresetConfigForSave(currentPresetConfig);
            document.getElementById('preset-json').value = JSON.stringify(currentPresetConfig, null, 2);
            refreshDuplicateWarning();
        }

        /* --- Live editing of a saved preset (see /js/services/config-collab.js) --- */
        const Collab = window.ObsidianscoutConfigCollab || null;
        let presetCollab = null;
        let presetStatusBar = null;
        let presetViewKeys = [];
        let presetRawBase = null;
        let applyingRemotePreset = false;

        function presetProjectTop(doc) {
            return {
                title: typeof doc.title === 'string' ? doc.title.trim() : 'ObsidianScout',
                version: Number(doc.version || 1),
                analytics: Array.isArray(doc.analytics) ? doc.analytics : []
            };
        }

        function presetProjectField(field) {
            if (!field || typeof field !== 'object' || Array.isArray(field)) return null;
            try {
                return cleanPresetField(field);
            } catch (e) {
                return field;
            }
        }

        /** The editor's current form, as live edits compare it (field ids are only filled in on save). */
        function presetEditorView() {
            return {
                title: (document.getElementById('config-title').value || '').trim(),
                version: Number(document.getElementById('config-version').value || 1),
                fields: (currentPresetConfig.fields || []).map(cleanPresetField),
                analytics: currentPresetConfig.analytics || []
            };
        }

        /** Shares the latest local edit with everyone else editing this preset. */
        function syncPresetLive() {
            if (!presetCollab || applyingRemotePreset) return;
            presetViewKeys = presetCollab.commit(presetEditorView()).keys;
            presetRawBase = presetCollab.lastView;
        }

        function startPresetLiveEditing(presetId) {
            stopPresetLiveEditing();
            const host = document.getElementById('preset-collab-status');
            if (!Collab || !presetId || !host) return;
            presetStatusBar = Collab.createStatusBar(host);
            const session = new Collab.ConfigCollabSession({
                url: `/api/config-collab/preset/${encodeURIComponent(presetId)}`,
                projectField: presetProjectField,
                projectRest: presetProjectTop,
                onView: (view) => { if (presetCollab === session) applyPresetView(view); },
                onStatus: (status) => {
                    if (presetCollab !== session) return;
                    presetStatusBar.update(status);
                    document.getElementById('btn-cancel-modal').textContent = status === 'live' ? 'Close' : 'Cancel';
                },
                onPresence: (editors) => {
                    if (presetCollab !== session) return;
                    presetStatusBar.setEditors(editors, session.sid);
                    Collab.decorateCards(document.getElementById('visual-fields-list'), editors, session.sid);
                },
                onNotice: (level, message) => {
                    if (presetCollab !== session || !message) return;
                    if (window.Obsidianscout) Obsidianscout.showToast(message, level === 'error' ? 'error' : (level === 'success' ? 'success' : 'info'));
                }
            });
            presetCollab = session;
            presetStatusBar.update(session.status);
            applyPresetView(session.load(currentPresetConfig));
            session.connect();
        }

        function stopPresetLiveEditing() {
            if (presetCollab) presetCollab.close();
            presetCollab = null;
            presetViewKeys = [];
            presetRawBase = null;
            const host = document.getElementById('preset-collab-status');
            if (host) host.innerHTML = '';
            document.getElementById('btn-cancel-modal').textContent = 'Cancel';
        }

        function applyPresetView(view) {
            currentPresetConfig = JSON.parse(JSON.stringify(view.doc));
            presetViewKeys = view.keys.slice();
            const title = document.getElementById('config-title');
            const version = document.getElementById('config-version');
            if (title.value.trim() !== (currentPresetConfig.title || '')) title.value = currentPresetConfig.title || '';
            if (String(Number(version.value) || 1) !== String(currentPresetConfig.version || 1)) version.value = currentPresetConfig.version || 1;
            const raw = document.getElementById('preset-json');
            if (document.activeElement !== raw) {
                raw.value = JSON.stringify(view.doc, null, 2);
                presetRawBase = view;
            }
            const list = document.getElementById('visual-fields-list');
            applyingRemotePreset = true;
            try {
                Collab.preserveFocus(list, renderVisualFields);
            } finally {
                applyingRemotePreset = false;
            }
            Collab.decorateCards(list, presetCollab ? presetCollab.editors : [], presetCollab ? presetCollab.sid : null);
        }

        function commitPresetRaw() {
            if (!presetCollab) return;
            let parsed;
            try { parsed = JSON.parse(document.getElementById('preset-json').value); } catch (e) { return; }
            if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return;
            presetRawBase = presetCollab.commit(parsed, presetRawBase || presetCollab.lastView);
        }

        // Shared duplicate checker (js/utilities/config-duplicates.js); fall back to long, timestamp-based IDs if it failed to load.
        function newFieldId(existing, prefix = 'field_') {
            const tools = window.ObsidianscoutConfigDuplicates;
            return tools ? tools.uniqueFieldId(existing, prefix) : `${prefix}${Date.now()}`;
        }

        function uniqueOptionValue(field, option, base) {
            const tools = window.ObsidianscoutConfigDuplicates;
            if (!base || !tools) return base;
            const others = (field.options || []).filter(o => o !== option).map(o => o.value).filter(Boolean);
            return tools.uniqueValue(base, others);
        }

        function refreshDuplicateWarning() {
            const list = document.getElementById('visual-fields-list');
            if (list && window.ObsidianscoutConfigDuplicates) {
                window.ObsidianscoutConfigDuplicates.renderDuplicateWarning(list, currentPresetConfig);
            }
        }

        function renderVisualFields() {
            syncPresetLive();
            const list = document.getElementById('visual-fields-list');
            refreshDuplicateWarning();
            const fields = currentPresetConfig.fields || [];
            const supportsPts = supportsPointsConfig();
            const supportsPhs = supportsPhasesConfig();

            if (fields.length === 0) {
                list.innerHTML = `<p class="notice" style="text-align: center; padding: 16px;">No fields configured. Click "+ Add Field" above.</p>`;
                return;
            }

            list.innerHTML = fields.map((field, idx) => {
                const labelVal = typeof field.label === 'object' ? (field.label.en || Object.values(field.label)[0] || '') : (field.label || '');
                const rawType = field.type || 'text';
                const typeVal = canonicalizePresetFieldType(rawType);
                const phaseVal = field.phase || (supportsPhs ? 'teleop' : '');
                const isNumeric = typeVal === 'counter' || typeVal === 'number' || typeVal === 'rating';
                const isCheckbox = typeVal === 'checkbox';
                const isSelect = typeVal === 'select';
                const hasDoubleStep = (field.doubleStep !== undefined && field.doubleStep !== null && field.doubleStep !== '') ||
                                      (field.double_step !== undefined && field.double_step !== null && field.double_step !== '');
                const supportsNoLimit = typeVal === 'counter' || typeVal === 'number';
                const isNoLimit = supportsNoLimit && (field.max === undefined || field.max === null || field.max === '');

                const isStandardType = ['counter', 'number', 'rating', 'checkbox', 'select', 'section', 'text', 'textarea', 'image'].includes(typeVal);

                return `
                    <div class="visual-field-card" data-index="${idx}"${presetViewKeys[idx] ? ` data-collab-key="${escapeHtml(presetViewKeys[idx])}"` : ""}>
                        <div class="visual-field-header">
                            <strong>Field #${idx + 1}: ${escapeHtml(labelVal || field.id || 'Untitled')}</strong>
                            <div style="display: flex; gap: 6px; align-items: center;">
                                <button type="button" class="btn ghost btn-sm" title="Duplicate Field" onclick="duplicateVisualField(${idx})"><i class="fa-solid fa-copy"></i> Duplicate</button>
                                <button type="button" class="btn ghost btn-sm" title="Move Up" onclick="moveVisualField(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>⬆</button>
                                <button type="button" class="btn ghost btn-sm" title="Move Down" onclick="moveVisualField(${idx}, 1)" ${idx === fields.length - 1 ? 'disabled' : ''}>⬇</button>
                                <button type="button" class="btn ghost btn-sm" style="color:#ef4444;" title="Delete Field" onclick="removeVisualField(${idx})"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>

                        <div class="visual-field-grid">
                            <div class="field">
                                <label style="font-size:0.8rem;">Field Label</label>
                                <input type="text" class="input" value="${escapeHtml(labelVal)}" oninput="updateVisualField(${idx}, 'label', this.value)" placeholder="e.g. Teleop Coral Scored" />
                            </div>
                            <div class="field">
                                <label style="font-size:0.8rem;">Field ID (Key)</label>
                                <input type="text" class="input" value="${escapeHtml(field.id || '')}" oninput="updateVisualField(${idx}, 'id', this.value)" placeholder="e.g. teleop_coral" />
                            </div>
                            <div class="field">
                                <label style="font-size:0.8rem;">Type</label>
                                <select class="input" onchange="onFieldTypeChange(${idx}, this.value)">
                                    <option value="counter" ${typeVal === 'counter' ? 'selected' : ''}>Counter (+ / -)</option>
                                    <option value="number" ${typeVal === 'number' ? 'selected' : ''}>Number</option>
                                    <option value="rating" ${typeVal === 'rating' ? 'selected' : ''}>Rating (1-5)</option>
                                    <option value="checkbox" ${typeVal === 'checkbox' ? 'selected' : ''}>Checkbox / Toggle</option>
                                    <option value="select" ${typeVal === 'select' ? 'selected' : ''}>Dropdown Options</option>
                                    <option value="section" ${typeVal === 'section' ? 'selected' : ''}>Section Header</option>
                                    <option value="text" ${typeVal === 'text' ? 'selected' : ''}>Text (Static Display)</option>
                                    <option value="textarea" ${typeVal === 'textarea' ? 'selected' : ''}>Text Area (Input)</option>
                                    <option value="image" ${typeVal === 'image' ? 'selected' : ''}>Image (Photo Upload)</option>
                                    ${!isStandardType ? `<option value="${escapeHtml(typeVal)}" selected>${escapeHtml(typeVal.toUpperCase())}</option>` : ''}
                                </select>
                            </div>
                            ${supportsPhs ? `
                            <div class="field">
                                <label style="font-size:0.8rem;">Section / Phase</label>
                                <select class="input" onchange="updateVisualField(${idx}, 'phase', this.value)">
                                    <option value="auto" ${phaseVal === 'auto' ? 'selected' : ''}>Autonomous</option>
                                    <option value="teleop" ${(!phaseVal || phaseVal === 'teleop' || phaseVal === 'general') ? 'selected' : ''}>Teleop</option>
                                    <option value="endgame" ${phaseVal === 'endgame' ? 'selected' : ''}>Endgame</option>
                                    <option value="postmatch" ${phaseVal === 'postmatch' ? 'selected' : ''}>Post Match</option>
                                </select>
                            </div>
                            ` : ''}
                            ${typeVal !== 'text' && typeVal !== 'section' ? `
                            <div class="field">
                                <label style="font-size:0.8rem;">Required</label>
                                <label style="display: flex; align-items: center; gap: 8px; height: 38px; cursor: pointer; margin: 0;">
                                    <input type="checkbox" ${field.required ? 'checked' : ''} onchange="updateVisualField(${idx}, 'required', this.checked)" />
                                    <span style="font-size: 0.85rem;">Is Required</span>
                                </label>
                            </div>
                            ` : ''}
                        </div>

                        ${isNumeric ? `
                        <div class="visual-field-grid" style="margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--border);">
                            <div class="field">
                                <label style="font-size:0.8rem;">Min</label>
                                <input type="number" class="input" value="${field.min !== undefined && field.min !== null ? field.min : ''}" oninput="updateVisualField(${idx}, 'min', this.value !== '' ? Number(this.value) : null)" placeholder="0" />
                            </div>
                            <div class="field">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <label style="font-size:0.8rem;">Max</label>
                                    ${supportsNoLimit ? `
                                    <label style="display: flex; align-items: center; gap: 4px; font-size: 0.75rem; color: var(--muted); cursor: pointer;">
                                        <input type="checkbox" ${isNoLimit ? 'checked' : ''} onchange="toggleCounterNoLimit(${idx}, this.checked)" /> No limit
                                    </label>
                                    ` : ''}
                                </div>
                                <input type="number" id="field-${idx}-max" class="input" ${isNoLimit ? 'disabled' : ''} value="${field.max !== undefined && field.max !== null ? field.max : ''}" oninput="updateVisualField(${idx}, 'max', this.value !== '' ? Number(this.value) : null)" placeholder="10" />
                            </div>
                            <div class="field">
                                <label style="font-size:0.8rem;">Step</label>
                                <input type="number" class="input" value="${field.step !== undefined && field.step !== null ? field.step : 1}" oninput="updateVisualField(${idx}, 'step', this.value !== '' ? Number(this.value) : null)" placeholder="1" />
                            </div>
                            ${typeVal === 'counter' ? `
                            <div class="field">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <label style="font-size:0.8rem;">Double Step</label>
                                    <label style="display: flex; align-items: center; gap: 4px; font-size: 0.75rem; color: var(--muted); cursor: pointer;">
                                        <input type="checkbox" ${hasDoubleStep ? 'checked' : ''} onchange="toggleCounterDoubleStep(${idx}, this.checked)" /> Enable
                                    </label>
                                </div>
                                <input type="number" id="field-${idx}-doubleStep" class="input" ${!hasDoubleStep ? 'disabled' : ''} value="${hasDoubleStep ? (field.doubleStep ?? field.double_step) : ''}" oninput="updateVisualField(${idx}, 'doubleStep', this.value !== '' ? Number(this.value) : null)" placeholder="e.g. 5" />
                            </div>
                            ` : ''}
                            ${supportsPts ? `
                            <div class="field">
                                <label style="font-size:0.8rem; font-weight: 700; color: var(--accent, #6366f1);">Points per action</label>
                                <input type="number" step="any" class="input" value="${field.pointsPer !== undefined && field.pointsPer !== null ? field.pointsPer : ''}" oninput="updateVisualField(${idx}, 'pointsPer', this.value !== '' ? Number(this.value) : null)" placeholder="e.g. 3.0" style="border-color: rgba(99, 102, 241, 0.4);" />
                            </div>
                            ` : ''}
                        </div>
                        ` : ''}

                        ${isCheckbox && supportsPts ? `
                        <div class="visual-field-grid" style="margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--border);">
                            <div class="field" style="max-width: 250px;">
                                <label style="font-size:0.8rem; font-weight: 700; color: var(--accent, #6366f1);">Points per action</label>
                                <input type="number" step="any" class="input" value="${field.pointsPer !== undefined && field.pointsPer !== null ? field.pointsPer : ''}" oninput="updateVisualField(${idx}, 'pointsPer', this.value !== '' ? Number(this.value) : null)" placeholder="e.g. 5.0" style="border-color: rgba(99, 102, 241, 0.4);" />
                            </div>
                        </div>
                        ` : ''}

                        ${isSelect ? `
                        <div class="options-builder">
                            <div class="options-builder-header">
                                <span class="options-builder-title">${supportsPts ? 'Options (Label | Value | Points)' : 'Options (Label | Value)'}</span>
                                <button type="button" class="btn secondary btn-sm" onclick="addSelectOption(${idx})">+ Add Option</button>
                            </div>
                            <div class="options-builder-list">
                                ${(field.options && field.options.length > 0) ? field.options.map((opt, optIdx) => {
                                    const optLabel = typeof opt.label === 'object' ? (opt.label.en || Object.values(opt.label)[0] || '') : (opt.label || '');
                                    const optVal = opt.value || '';
                                    const optPts = opt.points !== undefined && opt.points !== null ? opt.points : 0;
                                    return `
                                        <div class="option-item-row">
                                            <input type="text" class="input" value="${escapeHtml(optLabel)}" placeholder="Label (e.g. High)" oninput="updateSelectOption(${idx}, ${optIdx}, 'label', this.value)" />
                                            <input type="text" class="input" value="${escapeHtml(optVal)}" placeholder="Value" oninput="updateSelectOption(${idx}, ${optIdx}, 'value', this.value)" />
                                            ${supportsPts ? `
                                            <input type="number" step="any" class="input" value="${optPts}" placeholder="Pts" oninput="updateSelectOption(${idx}, ${optIdx}, 'points', Number(this.value))" title="Point Value" />
                                            ` : ''}
                                            <button type="button" class="btn ghost btn-sm" style="color:#ef4444;" title="Delete Option" onclick="removeSelectOption(${idx}, ${optIdx})"><i class="fa-solid fa-trash"></i></button>
                                        </div>
                                    `;
                                }).join('') : `<p class="notice" style="margin: 4px 0; font-size: 0.8rem;">No options defined. Click "+ Add Option" above.</p>`}
                            </div>
                        </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function onFieldTypeChange(idx, newType) {
            const field = currentPresetConfig.fields[idx];
            if (!field) return;
            field.type = newType;
            if (newType === 'text' || newType === 'section') {
                field.required = false;
                delete field.min;
                delete field.max;
                delete field.step;
                delete field.doubleStep;
                delete field.pointsPer;
            } else if (newType === 'counter' || newType === 'number' || newType === 'rating') {
                if (field.min === undefined) field.min = newType === 'rating' ? 1 : 0;
                if (field.max === undefined) field.max = newType === 'rating' ? 5 : (newType === 'counter' ? null : 10);
                if (field.step === undefined) field.step = 1;
                if (newType !== 'counter') {
                    delete field.doubleStep;
                    delete field.double_step;
                }
            } else if (newType === 'select') {
                if (!field.options || !Array.isArray(field.options)) {
                    field.options = [
                        { label: "Option 1", value: "option_1", points: 0 }
                    ];
                }
            }
            renderVisualFields();
        }

        function toggleCounterNoLimit(idx, isNoLimit) {
            const field = currentPresetConfig.fields[idx];
            if (!field) return;
            if (isNoLimit) {
                field.max = null;
            } else {
                field.max = 10;
            }
            renderVisualFields();
        }

        function toggleCounterDoubleStep(idx, isEnabled) {
            const field = currentPresetConfig.fields[idx];
            if (!field) return;
            if (isEnabled) {
                field.doubleStep = 5;
            } else {
                field.doubleStep = null;
                delete field.double_step;
            }
            renderVisualFields();
        }

        function addSelectOption(fieldIdx) {
            const field = currentPresetConfig.fields[fieldIdx];
            if (!field) return;
            if (!field.options) field.options = [];
            const optNumber = field.options.length + 1;
            const newOption = { label: `Option ${optNumber}`, value: '', points: 0 };
            field.options.push(newOption);
            newOption.value = uniqueOptionValue(field, newOption, `option_${optNumber}`);
            renderVisualFields();
        }

        function updateSelectOption(fieldIdx, optIdx, prop, val) {
            const field = currentPresetConfig.fields[fieldIdx];
            if (!field || !field.options || !field.options[optIdx]) return;
            const option = field.options[optIdx];
            option[prop] = val;
            if (prop === 'label' && (!option.value || option.value.startsWith('option_'))) {
                option.value = uniqueOptionValue(field, option, val.toLowerCase().replace(/[^a-z0-9]/g, '_'));
            }
            refreshDuplicateWarning();
            syncPresetLive();
        }

        function removeSelectOption(fieldIdx, optIdx) {
            const field = currentPresetConfig.fields[fieldIdx];
            if (!field || !field.options) return;
            field.options.splice(optIdx, 1);
            renderVisualFields();
        }

        function duplicateVisualField(idx) {
            const field = currentPresetConfig.fields[idx];
            if (!field) return;
            const copy = JSON.parse(JSON.stringify(field));
            copy.id = newFieldId(currentPresetConfig.fields, `${field.id}_copy_`);
            const labelVal = typeof field.label === 'object' ? (field.label.en || Object.values(field.label)[0] || '') : (field.label || '');
            copy.label = `${labelVal} (Copy)`;
            currentPresetConfig.fields.splice(idx + 1, 0, copy);
            renderVisualFields();
        }

        function updateVisualField(idx, prop, val) {
            if (!currentPresetConfig.fields[idx]) return;
            const field = currentPresetConfig.fields[idx];
            field[prop] = val;
            if (prop === 'label' && !field.id) {
                const base = val.toLowerCase().replace(/[^a-z0-9]/g, '_');
                const tools = window.ObsidianscoutConfigDuplicates;
                const otherIds = currentPresetConfig.fields.filter(f => f !== field).map(f => f.id).filter(Boolean);
                field.id = base && tools ? tools.uniqueValue(base, otherIds) : base;
            }
            if (prop === 'id' || prop === 'label') {
                refreshDuplicateWarning();
            }
            syncPresetLive();
        }

        function addVisualField() {
            if (!currentPresetConfig.fields) currentPresetConfig.fields = [];
            const supportsPts = supportsPointsConfig();
            const supportsPhs = supportsPhasesConfig();
            currentPresetConfig.fields.push({
                id: newFieldId(currentPresetConfig.fields),
                label: "New Field",
                type: "counter",
                min: 0,
                step: 1,
                ...(supportsPts ? { pointsPer: 1.0 } : {}),
                ...(supportsPhs ? { phase: "auto" } : {})
            });
            renderVisualFields();
        }

        function moveVisualField(idx, dir) {
            const target = idx + dir;
            if (target < 0 || target >= currentPresetConfig.fields.length) return;
            const temp = currentPresetConfig.fields[idx];
            currentPresetConfig.fields[idx] = currentPresetConfig.fields[target];
            currentPresetConfig.fields[target] = temp;
            renderVisualFields();
        }

        function removeVisualField(idx) {
            currentPresetConfig.fields.splice(idx, 1);
            renderVisualFields();
        }

        /* --- Modal Operations --- */
        function openModal(preset = null) {
            document.getElementById('json-error').style.display = 'none';
            if (preset) {
                document.getElementById('modal-title').textContent = 'Edit Default Config Preset';
                document.getElementById('preset-id').value = preset.id || '';
                document.getElementById('preset-name').value = preset.name || '';
                document.getElementById('preset-program').value = preset.program || 'FTC';
                document.getElementById('preset-type').value = preset.configType || 'match';
                document.getElementById('preset-is-default').checked = !!preset.isDefault;
                try {
                    currentPresetConfig = JSON.parse(preset.configJson);
                } catch (_) {
                    currentPresetConfig = { title: preset.name, version: 1, fields: [], analytics: [] };
                }
            } else {
                document.getElementById('modal-title').textContent = 'Create Default Config Preset';
                document.getElementById('preset-id').value = '';
                document.getElementById('preset-name').value = '';
                document.getElementById('preset-program').value = 'FTC';
                document.getElementById('preset-type').value = 'match';
                document.getElementById('preset-is-default').checked = false;
                currentPresetConfig = {
                    title: "Sample Scouting Config",
                    version: 1,
                    fields: [
                        { id: "sec_auto", label: "Autonomous", type: "section", phase: "auto" },
                        { id: "auto_scored", label: "Auto Scored", type: "counter", phase: "auto" }
                    ],
                    analytics: []
                };
            }

            document.getElementById('config-title').value = currentPresetConfig.title || '';
            document.getElementById('config-version').value = currentPresetConfig.version || 1;
            document.getElementById('preset-json').value = JSON.stringify(currentPresetConfig, null, 2);

            switchEditorTab('visual');
            document.getElementById('preset-modal').style.display = 'flex';
            // Saved presets are edited live with anyone else who has them open; new ones once created.
            if (preset && preset.id) startPresetLiveEditing(preset.id); else stopPresetLiveEditing();
        }

        function closeModal() {
            stopPresetLiveEditing();
            document.getElementById('preset-modal').style.display = 'none';
        }

        function editPreset(id) {
            const p = allPresets.find(item => item.id === id);
            if (p) openModal(p);
        }

        function duplicatePreset(id) {
            const p = allPresets.find(item => item.id === id);
            if (p) {
                openModal({
                    ...p,
                    id: '',
                    name: `${p.name}_copy`,
                    isDefault: false
                });
            }
        }

        async function setActivePreset(id) {
            const preset = allPresets.find(item => item.id === id);
            if (!preset) return;
            try {
                const updated = {
                    ...preset,
                    isDefault: true
                };
                if (window.Obsidianscout) {
                    await Obsidianscout.request(`/api/admin/default-configs/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updated)
                    });
                } else {
                    const res = await fetch(`/api/admin/default-configs/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updated)
                    });
                    if (!res.ok) throw new Error('Failed to set active default preset');
                }
                await loadPresets();
            } catch (err) {
                alert(`Error setting active default: ${err.message}`);
            }
        }

        async function deletePreset(id, name) {
            if (!confirm(`Are you sure you want to delete the default config preset '${name}'?`)) return;
            try {
                if (window.Obsidianscout) {
                    await Obsidianscout.request(`/api/admin/default-configs/${id}`, { method: 'DELETE' });
                } else {
                    const res = await fetch(`/api/admin/default-configs/${id}`, { method: 'DELETE' });
                    if (!res.ok) throw new Error('Failed to delete preset');
                }
                await loadPresets();
            } catch (err) {
                alert(`Error deleting preset: ${err.message}`);
            }
        }

        /* --- Event Listeners --- */
        document.getElementById('btn-create-preset').addEventListener('click', () => openModal());
        document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);
        document.getElementById('filter-program').addEventListener('change', renderPresets);
        document.getElementById('filter-type').addEventListener('change', renderPresets);
        document.getElementById('btn-add-field').addEventListener('click', addVisualField);

        document.getElementById('tab-visual').addEventListener('click', () => switchEditorTab('visual'));
        document.getElementById('tab-raw').addEventListener('click', () => switchEditorTab('raw'));
        document.getElementById('preset-type').addEventListener('change', renderVisualFields);

        document.getElementById('config-title').addEventListener('input', syncPresetLive);
        document.getElementById('config-version').addEventListener('input', syncPresetLive);
        let presetRawTimer = null;
        document.getElementById('preset-json').addEventListener('input', () => {
            clearTimeout(presetRawTimer);
            presetRawTimer = setTimeout(commitPresetRaw, 400);
        });
        document.getElementById('preset-json').addEventListener('blur', (e) => {
            clearTimeout(presetRawTimer);
            commitPresetRaw();
            // Show anything others changed while the text had focus.
            if (presetCollab && !presetCollab.hasUnsavedChanges) {
                e.target.value = JSON.stringify(presetCollab.lastView.doc, null, 2);
                presetRawBase = presetCollab.lastView;
            }
        });
        document.getElementById('visual-fields-list').addEventListener('focusin', (e) => {
            const card = e.target.closest('[data-collab-key]');
            if (presetCollab) presetCollab.setFocus(card ? card.dataset.collabKey : null);
        });
        document.getElementById('visual-fields-list').addEventListener('focusout', () => {
            setTimeout(() => {
                const list = document.getElementById('visual-fields-list');
                if (presetCollab && !list.contains(document.activeElement)) presetCollab.setFocus(null);
            }, 0);
        });

        document.getElementById('btn-format-json').addEventListener('click', () => {
            const textarea = document.getElementById('preset-json');
            const errDiv = document.getElementById('json-error');
            try {
                const parsed = JSON.parse(textarea.value);
                textarea.value = JSON.stringify(parsed, null, 2);
                errDiv.style.display = 'none';
            } catch (e) {
                errDiv.textContent = `Invalid JSON: ${e.message}`;
                errDiv.style.display = 'block';
            }
        });

        document.getElementById('preset-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('preset-form').querySelector('button[type="submit"]');

            // Ensure Raw JSON is up to date if submitting from Visual tab
            if (activeEditorTab === 'visual') {
                updateRawFromVisual();
            } else {
                commitPresetRaw();
            }

            const id = document.getElementById('preset-id').value;
            const name = document.getElementById('preset-name').value.trim();
            const program = document.getElementById('preset-program').value;
            const configType = document.getElementById('preset-type').value;
            const isDefault = document.getElementById('preset-is-default').checked;
            const rawJson = document.getElementById('preset-json').value;

            let finalJson = rawJson;
            try {
                const parsed = JSON.parse(rawJson);
                finalJson = JSON.stringify(cleanPresetConfigForSave(parsed), null, 2);
            } catch (err) {
                const errDiv = document.getElementById('json-error');
                errDiv.textContent = `JSON Error: ${err.message}`;
                errDiv.style.display = 'block';
                if (window.Obsidianscout) {
                    Obsidianscout.setButtonLoading(submitBtn, false);
                }
                return;
            }

            const dto = {
                name,
                program,
                configType,
                configJson: finalJson,
                isDefault
            };

            if (window.Obsidianscout) {
                Obsidianscout.setButtonLoading(submitBtn, true, "Saving...");
            }

            try {
                const method = id ? 'PUT' : 'POST';
                const url = id ? `/api/admin/default-configs/${id}` : '/api/admin/default-configs';
                if (presetCollab && id && !presetCollab.isLive && window.Obsidianscout) {
                    // Live editing is down: merge with anything saved meanwhile instead of overwriting it.
                    await presetCollab.saveViaRest(
                        async () => {
                            const current = (await Obsidianscout.request('/api/admin/default-configs')).find(p => p.id === id);
                            return current ? JSON.parse(current.configJson) : {};
                        },
                        (doc) => {
                            document.getElementById('config-title').value = doc.title || '';
                            document.getElementById('config-version').value = doc.version || 1;
                            dto.configJson = JSON.stringify(cleanPresetConfigForSave(doc), null, 2);
                            return Obsidianscout.request(url, { method, json: dto });
                        }
                    );
                } else if (window.Obsidianscout) {
                    if (presetCollab && presetCollab.isLive) await presetCollab.saveVersion();
                    await Obsidianscout.request(url, {
                        method,
                        json: dto
                    });
                } else {
                    const res = await fetch(url, {
                        method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(dto)
                    });
                    if (!res.ok) {
                        const errorObj = await res.json().catch(() => ({}));
                        throw new Error(errorObj.error || 'Failed to save preset');
                    }
                }
                closeModal();
                await loadPresets();
            } catch (err) {
                alert(`Error: ${err.message}`);
            } finally {
                if (window.Obsidianscout) {
                    Obsidianscout.setButtonLoading(submitBtn, false);
                }
            }
        });

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const me = await Obsidianscout.requireAuth();
            if (!me) return;
            await loadPresets();
        });
    </script>
</body>
</html>
