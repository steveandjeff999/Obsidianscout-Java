<!doctype html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/obsidian/obsidian-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/obsidian/obsidian-512.png" />
    <link class="apple-touch-icon" href="/assets/images/obsidian/obsidian-192.png" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ObsidianScout | Manage Default Configs</title>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="manifest" href="/manifest.json" />

    <style>
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .preset-card {
            background: var(--card-bg, var(--surface-1, #1e1e2d));
            border: 1px solid var(--border, rgba(255, 255, 255, 0.1));
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .preset-card:hover {
            border-color: var(--accent, #6366f1);
            transform: translateY(-2px);
        }
        .preset-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 12px;
        }
        .preset-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--ink);
            margin: 0;
        }
        .preset-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-frc { background: rgba(239, 68, 68, 0.12); color: #dc2626; border: 1px solid rgba(239, 68, 68, 0.25); }
        .badge-ftc { background: rgba(59, 130, 246, 0.12); color: #2563eb; border: 1px solid rgba(59, 130, 246, 0.25); }
        .badge-type { background: rgba(168, 85, 247, 0.12); color: #9333ea; border: 1px solid rgba(168, 85, 247, 0.25); margin-left: 6px; }
        .badge-active { background: rgba(34, 197, 94, 0.12); color: #16a34a; border: 1px solid rgba(34, 197, 94, 0.25); margin-left: 6px; }
        
        body.theme-dark .badge-frc { background: rgba(239, 68, 68, 0.2); color: #f87171; border-color: rgba(239, 68, 68, 0.4); }
        body.theme-dark .badge-ftc { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border-color: rgba(59, 130, 246, 0.4); }
        body.theme-dark .badge-type { background: rgba(168, 85, 247, 0.2); color: #c084fc; border-color: rgba(168, 85, 247, 0.4); }
        body.theme-dark .badge-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; border-color: rgba(34, 197, 94, 0.4); }

        .preset-meta {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 16px;
        }
        .preset-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .filter-bar {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
            background: var(--surface-1);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Editor Tabs */
        .editor-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        .editor-tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--muted);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .editor-tab-btn:hover {
            color: var(--ink);
            background: var(--surface-2);
        }
        .editor-tab-btn.active {
            color: var(--accent);
            background: var(--surface-2);
            border-color: var(--accent);
        }

        /* Visual Field Cards */
        .visual-field-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .visual-field-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .visual-field-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
        }

        .json-editor {
            width: 100%;
            height: 320px;
            font-family: monospace;
            font-size: 0.9rem;
            background: var(--surface-2);
            color: var(--ink);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            resize: vertical;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: var(--card-bg, var(--surface-1));
            color: var(--ink);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 780px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .hidden { display: none !important; }
    </style>
</head>

<body data-page="default-configs">
    <script>
        (function() {
            try {
                const saved = localStorage.getItem("obsidian-theme") || "light";
                if (saved === "dark") {
                    document.body.classList.add("theme-dark");
                }
            } catch (e) {
                console.warn("Theme storage access failed:", e);
            }
        })();
    </script>

    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="app-shell">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 20px;">
                    <div>
                        <h1 style="margin: 0;">Default Configs Manager</h1>
                        <p class="notice" style="margin-top: 4px;">Create, edit, and set system default configurations for FTC and FRC teams.</p>
                    </div>
                    <button id="btn-create-preset" class="btn primary" type="button">+ Create New Default Preset</button>
                </div>

                <div class="filter-bar">
                    <div class="filter-group">
                        <label for="filter-program"><strong>Program:</strong></label>
                        <select id="filter-program" class="input" style="width: auto;">
                            <option value="ALL">All Programs</option>
                            <option value="FTC">FTC</option>
                            <option value="FRC">FRC</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filter-type"><strong>Type:</strong></label>
                        <select id="filter-type" class="input" style="width: auto;">
                            <option value="ALL">All Types</option>
                            <option value="match">Match</option>
                            <option value="pit">Pit</option>
                            <option value="qualitative">Qualitative</option>
                        </select>
                    </div>
                    <div style="margin-left: auto;">
                        <span id="preset-count" class="badge">0 presets</span>
                    </div>
                </div>

                <div id="preset-list" class="preset-grid"></div>
            </div>
        </main>
    </div>

    <!-- Modal for Creating/Editing Default Config Preset -->
    <div id="preset-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-top: 0;">Create Default Config Preset</h2>

            <form id="preset-form">
                <input type="hidden" id="preset-id" />

                <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px;">
                    <div class="field">
                        <label for="preset-name">Preset Name</label>
                        <input type="text" id="preset-name" class="input" placeholder="e.g. ftc2026, frc2026" required />
                    </div>

                    <div class="field">
                        <label for="preset-program">Program</label>
                        <select id="preset-program" class="input" required>
                            <option value="FTC">FTC</option>
                            <option value="FRC">FRC</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="preset-type">Config Type</label>
                        <select id="preset-type" class="input" required>
                            <option value="match">Match</option>
                            <option value="pit">Pit</option>
                            <option value="qualitative">Qualitative</option>
                        </select>
                    </div>
                </div>

                <div class="field" style="margin-bottom: 16px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="preset-is-default" />
                        <span><strong>Set as Active Default</strong> for this Program and Type</span>
                    </label>
                </div>

                <!-- Editor Sub-Tabs -->
                <div class="editor-tabs">
                    <button type="button" id="tab-visual" class="editor-tab-btn active">⚡ Simple / Visual Editor</button>
                    <button type="button" id="tab-raw" class="editor-tab-btn">{ } Raw JSON Editor</button>
                </div>

                <!-- Container 1: Visual Field Builder -->
                <div id="visual-editor-container" style="margin-bottom: 20px;">
                    <div class="form-grid" style="grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 16px;">
                        <div class="field">
                            <label for="config-title">Scouting Title</label>
                            <input type="text" id="config-title" class="input" placeholder="e.g. FTC 2026 Into The Deep Scouting" />
                        </div>
                        <div class="field">
                            <label for="config-version">Version</label>
                            <input type="number" id="config-version" class="input" value="1" min="1" />
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <h4 style="margin: 0; font-size: 0.95rem; color: var(--ink);">Scouting Fields & Sections</h4>
                        <button type="button" id="btn-add-field" class="btn ghost btn-sm">+ Add Field</button>
                    </div>

                    <div id="visual-fields-list"></div>
                </div>

                <!-- Container 2: Raw JSON Editor -->
                <div id="raw-editor-container" class="field hidden" style="margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label for="preset-json" style="margin: 0;">Configuration JSON</label>
                        <button type="button" id="btn-format-json" class="btn ghost btn-sm">Format JSON</button>
                    </div>
                    <textarea id="preset-json" class="json-editor" placeholder="{ &quot;title&quot;: &quot;...&quot;, &quot;fields&quot;: [] }"></textarea>
                    <div id="json-error" style="color: #ef4444; font-size: 0.85rem; margin-top: 6px; display: none;"></div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid var(--border); padding-top: 16px;">
                    <button type="button" id="btn-cancel-modal" class="btn ghost">Cancel</button>
                    <button type="submit" id="btn-save-modal" class="btn primary">Save Preset</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/js/common.js"></script>
    <script>
        let allPresets = [];
        let currentPresetConfig = { title: "", version: 1, fields: [], analytics: [] };
        let activeEditorTab = "visual"; // "visual" or "raw"

        async function loadPresets() {
            try {
                const res = await fetch('/api/admin/default-configs');
                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) {
                        alert('You must be a site admin to manage default configs.');
                        window.location.href = '/admin-settings';
                        return;
                    }
                    throw new Error('Failed to fetch presets');
                }
                allPresets = await res.json();
                renderPresets();
            } catch (err) {
                console.error(err);
                document.getElementById('preset-list').innerHTML = `<p class="notice" style="color:#ef4444;">Error loading default configs: ${err.message}</p>`;
            }
        }

        function renderPresets() {
            const progFilter = document.getElementById('filter-program').value;
            const typeFilter = document.getElementById('filter-type').value;

            const filtered = allPresets.filter(p => {
                const matchProg = progFilter === 'ALL' || p.program === progFilter;
                const matchType = typeFilter === 'ALL' || p.configType.toLowerCase() === typeFilter.toLowerCase();
                return matchProg && matchType;
            });

            document.getElementById('preset-count').textContent = `${filtered.length} preset${filtered.length === 1 ? '' : 's'}`;

            const container = document.getElementById('preset-list');
            if (filtered.length === 0) {
                container.innerHTML = `<div class="card soft" style="grid-column: 1/-1; text-align: center; padding: 40px;"><p class="notice">No default config presets match your filters.</p></div>`;
                return;
            }

            container.innerHTML = filtered.map(p => {
                const progBadge = p.program === 'FTC' ? 'badge-ftc' : 'badge-frc';
                const defaultBadge = p.isDefault ? `<span class="preset-badge badge-active">Active Default</span>` : '';
                return `
                    <div class="preset-card">
                        <div>
                            <div class="preset-header">
                                <h3 class="preset-title">${escapeHtml(p.name)}</h3>
                                <div>
                                    <span class="preset-badge ${progBadge}">${escapeHtml(p.program)}</span>
                                    <span class="preset-badge badge-type">${escapeHtml(p.configType)}</span>
                                    ${defaultBadge}
                                </div>
                            </div>
                            <div class="preset-meta">
                                Modified: ${p.updatedAt ? new Date(p.updatedAt).toLocaleDateString() : 'N/A'}
                            </div>
                        </div>
                        <div class="preset-actions">
                            <button class="btn ghost btn-sm" onclick="editPreset('${p.id}')">Edit</button>
                            <button class="btn ghost btn-sm" onclick="duplicatePreset('${p.id}')">Duplicate</button>
                            <button class="btn ghost btn-sm" style="color:#ef4444;" onclick="deletePreset('${p.id}', '${escapeHtml(p.name)}')">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        /* --- Visual Field Builder Logic --- */
        function switchEditorTab(tab) {
            activeEditorTab = tab;
            const tabVisual = document.getElementById('tab-visual');
            const tabRaw = document.getElementById('tab-raw');
            const containerVisual = document.getElementById('visual-editor-container');
            const containerRaw = document.getElementById('raw-editor-container');
            const jsonError = document.getElementById('json-error');

            jsonError.style.display = 'none';

            if (tab === 'visual') {
                const rawText = document.getElementById('preset-json').value.trim();
                try {
                    if (rawText) {
                        const parsed = JSON.parse(rawText);
                        currentPresetConfig = parsed;
                        if (!currentPresetConfig.fields) currentPresetConfig.fields = [];
                        document.getElementById('config-title').value = currentPresetConfig.title || '';
                        document.getElementById('config-version').value = currentPresetConfig.version || 1;
                    }
                } catch (e) {
                    alert(`Raw JSON has errors. Please fix syntax before switching to Simple Editor: ${e.message}`);
                    return;
                }
                renderVisualFields();
                tabRaw.classList.remove('active');
                tabVisual.classList.add('active');
                containerRaw.classList.add('hidden');
                containerVisual.classList.remove('hidden');
            } else {
                updateRawFromVisual();
                tabVisual.classList.remove('active');
                tabRaw.classList.add('active');
                containerVisual.classList.add('hidden');
                containerRaw.classList.remove('hidden');
            }
        }

        function updateRawFromVisual() {
            currentPresetConfig.title = document.getElementById('config-title').value.trim() || "Scouting Config";
            currentPresetConfig.version = Number(document.getElementById('config-version').value) || 1;
            document.getElementById('preset-json').value = JSON.stringify(currentPresetConfig, null, 2);
        }

        function renderVisualFields() {
            const list = document.getElementById('visual-fields-list');
            const fields = currentPresetConfig.fields || [];

            if (fields.length === 0) {
                list.innerHTML = `<p class="notice" style="text-align: center; padding: 16px;">No fields configured. Click "+ Add Field" above.</p>`;
                return;
            }

            list.innerHTML = fields.map((field, idx) => {
                const labelVal = typeof field.label === 'object' ? (field.label.en || Object.values(field.label)[0] || '') : (field.label || '');
                const typeVal = field.type || 'text';
                const phaseVal = field.phase || '';

                const isSelect = typeVal === 'select' || typeVal === 'multiselect';
                const optionsVal = isSelect ? (field.options || []).map(o => typeof o === 'object' ? o.value : o).join(', ') : '';

                return `
                    <div class="visual-field-card" data-index="${idx}">
                        <div class="visual-field-header">
                            <strong>Field #${idx + 1}: ${escapeHtml(labelVal || field.id || 'Untitled')}</strong>
                            <div style="display: flex; gap: 6px;">
                                <button type="button" class="btn ghost btn-sm" onclick="moveVisualField(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>⬆</button>
                                <button type="button" class="btn ghost btn-sm" onclick="moveVisualField(${idx}, 1)" ${idx === fields.length - 1 ? 'disabled' : ''}>⬇</button>
                                <button type="button" class="btn ghost btn-sm" style="color:#ef4444;" onclick="removeVisualField(${idx})">🗑️</button>
                            </div>
                        </div>
                        <div class="visual-field-grid">
                            <div class="field">
                                <label style="font-size:0.8rem;">Field Label</label>
                                <input type="text" class="input" value="${escapeHtml(labelVal)}" onchange="updateVisualField(${idx}, 'label', this.value)" placeholder="e.g. Teleop Coral Scored" />
                            </div>
                            <div class="field">
                                <label style="font-size:0.8rem;">Field ID (Key)</label>
                                <input type="text" class="input" value="${escapeHtml(field.id || '')}" onchange="updateVisualField(${idx}, 'id', this.value)" placeholder="e.g. teleop_coral" />
                            </div>
                            <div class="field">
                                <label style="font-size:0.8rem;">Type</label>
                                <select class="input" onchange="updateVisualField(${idx}, 'type', this.value)">
                                    <option value="counter" ${typeVal === 'counter' ? 'selected' : ''}>Counter (+ / -)</option>
                                    <option value="number" ${typeVal === 'number' ? 'selected' : ''}>Number</option>
                                    <option value="rating" ${typeVal === 'rating' ? 'selected' : ''}>Rating (1-5)</option>
                                    <option value="toggle" ${typeVal === 'toggle' || typeVal === 'checkbox' || typeVal === 'boolean' ? 'selected' : ''}>Toggle / Checkbox</option>
                                    <option value="select" ${typeVal === 'select' ? 'selected' : ''}>Dropdown Options</option>
                                    <option value="text" ${typeVal === 'text' ? 'selected' : ''}>Text (Static Display)</option>
                                    <option value="textarea" ${typeVal === 'textarea' || typeVal === 'notes' ? 'selected' : ''}>Text Area (Input)</option>
                                </select>
                            </div>
                            <div class="field">
                                <label style="font-size:0.8rem;">Section / Phase</label>
                                <select class="input" onchange="updateVisualField(${idx}, 'phase', this.value)">
                                    <option value="auto" ${phaseVal === 'auto' ? 'selected' : ''}>Autonomous</option>
                                    <option value="teleop" ${(!phaseVal || phaseVal === 'teleop' || phaseVal === 'general') ? 'selected' : ''}>Teleop</option>
                                    <option value="endgame" ${phaseVal === 'endgame' ? 'selected' : ''}>Endgame</option>
                                    <option value="pit" ${phaseVal === 'pit' ? 'selected' : ''}>Pit Scouting</option>
                                </select>
                            </div>
                        </div>
                        ${isSelect ? `
                            <div class="field" style="margin-top: 6px;">
                                <label style="font-size:0.8rem;">Options (comma-separated)</label>
                                <input type="text" class="input" value="${escapeHtml(optionsVal)}" onchange="updateVisualFieldOptions(${idx}, this.value)" placeholder="e.g. None, Low, Medium, High" />
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function updateVisualField(idx, prop, val) {
            if (!currentPresetConfig.fields[idx]) return;
            currentPresetConfig.fields[idx][prop] = val;
            if (prop === 'label' && !currentPresetConfig.fields[idx].id) {
                currentPresetConfig.fields[idx].id = val.toLowerCase().replace(/[^a-z0-9]/g, '_');
            }
            renderVisualFields();
        }

        function updateVisualFieldOptions(idx, valString) {
            if (!currentPresetConfig.fields[idx]) return;
            const opts = valString.split(',').map(s => s.trim()).filter(Boolean);
            currentPresetConfig.fields[idx].options = opts.map(o => ({ label: o, value: o }));
        }

        function addVisualField() {
            if (!currentPresetConfig.fields) currentPresetConfig.fields = [];
            currentPresetConfig.fields.push({
                id: `field_${Date.now().toString().slice(-4)}`,
                label: "New Field",
                type: "number",
                phase: "auto"
            });
            renderVisualFields();
        }

        function moveVisualField(idx, dir) {
            const target = idx + dir;
            if (target < 0 || target >= currentPresetConfig.fields.length) return;
            const temp = currentPresetConfig.fields[idx];
            currentPresetConfig.fields[idx] = currentPresetConfig.fields[target];
            currentPresetConfig.fields[target] = temp;
            renderVisualFields();
        }

        function removeVisualField(idx) {
            currentPresetConfig.fields.splice(idx, 1);
            renderVisualFields();
        }

        /* --- Modal Operations --- */
        function openModal(preset = null) {
            document.getElementById('json-error').style.display = 'none';
            if (preset) {
                document.getElementById('modal-title').textContent = 'Edit Default Config Preset';
                document.getElementById('preset-id').value = preset.id || '';
                document.getElementById('preset-name').value = preset.name || '';
                document.getElementById('preset-program').value = preset.program || 'FTC';
                document.getElementById('preset-type').value = preset.configType || 'match';
                document.getElementById('preset-is-default').checked = !!preset.isDefault;
                try {
                    currentPresetConfig = JSON.parse(preset.configJson);
                } catch (_) {
                    currentPresetConfig = { title: preset.name, version: 1, fields: [], analytics: [] };
                }
            } else {
                document.getElementById('modal-title').textContent = 'Create Default Config Preset';
                document.getElementById('preset-id').value = '';
                document.getElementById('preset-name').value = '';
                document.getElementById('preset-program').value = 'FTC';
                document.getElementById('preset-type').value = 'match';
                document.getElementById('preset-is-default').checked = false;
                currentPresetConfig = {
                    title: "Sample Scouting Config",
                    version: 1,
                    fields: [
                        { id: "sec_auto", label: "Autonomous", type: "section", phase: "auto" },
                        { id: "auto_scored", label: "Auto Scored", type: "counter", phase: "auto" }
                    ],
                    analytics: []
                };
            }

            document.getElementById('config-title').value = currentPresetConfig.title || '';
            document.getElementById('config-version').value = currentPresetConfig.version || 1;
            document.getElementById('preset-json').value = JSON.stringify(currentPresetConfig, null, 2);

            switchEditorTab('visual');
            document.getElementById('preset-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('preset-modal').style.display = 'none';
        }

        function editPreset(id) {
            const p = allPresets.find(item => item.id === id);
            if (p) openModal(p);
        }

        function duplicatePreset(id) {
            const p = allPresets.find(item => item.id === id);
            if (p) {
                openModal({
                    ...p,
                    id: '',
                    name: `${p.name}_copy`,
                    isDefault: false
                });
            }
        }

        async function deletePreset(id, name) {
            if (!confirm(`Are you sure you want to delete the default config preset '${name}'?`)) return;
            try {
                const res = await fetch(`/api/admin/default-configs/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Failed to delete preset');
                await loadPresets();
            } catch (err) {
                alert(`Error deleting preset: ${err.message}`);
            }
        }

        /* --- Event Listeners --- */
        document.getElementById('btn-create-preset').addEventListener('click', () => openModal());
        document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);
        document.getElementById('filter-program').addEventListener('change', renderPresets);
        document.getElementById('filter-type').addEventListener('change', renderPresets);
        document.getElementById('btn-add-field').addEventListener('click', addVisualField);

        document.getElementById('tab-visual').addEventListener('click', () => switchEditorTab('visual'));
        document.getElementById('tab-raw').addEventListener('click', () => switchEditorTab('raw'));

        document.getElementById('btn-format-json').addEventListener('click', () => {
            const textarea = document.getElementById('preset-json');
            const errDiv = document.getElementById('json-error');
            try {
                const parsed = JSON.parse(textarea.value);
                textarea.value = JSON.stringify(parsed, null, 2);
                errDiv.style.display = 'none';
            } catch (e) {
                errDiv.textContent = `Invalid JSON: ${e.message}`;
                errDiv.style.display = 'block';
            }
        });

        document.getElementById('preset-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('preset-form').querySelector('button[type="submit"]');

            // Ensure Raw JSON is up to date if submitting from Visual tab
            if (activeEditorTab === 'visual') {
                updateRawFromVisual();
            }

            const id = document.getElementById('preset-id').value;
            const name = document.getElementById('preset-name').value.trim();
            const program = document.getElementById('preset-program').value;
            const configType = document.getElementById('preset-type').value;
            const isDefault = document.getElementById('preset-is-default').checked;
            const rawJson = document.getElementById('preset-json').value;

            try {
                JSON.parse(rawJson);
            } catch (err) {
                const errDiv = document.getElementById('json-error');
                errDiv.textContent = `JSON Error: ${err.message}`;
                errDiv.style.display = 'block';
                if (window.Obsidianscout) {
                    Obsidianscout.setButtonLoading(submitBtn, false);
                }
                return;
            }

            const dto = {
                name,
                program,
                configType,
                configJson: rawJson,
                isDefault
            };

            if (window.Obsidianscout) {
                Obsidianscout.setButtonLoading(submitBtn, true, "Saving...");
            }

            try {
                const method = id ? 'PUT' : 'POST';
                const url = id ? `/api/admin/default-configs/${id}` : '/api/admin/default-configs';
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dto)
                });
                if (!res.ok) {
                    const errorObj = await res.json().catch(() => ({}));
                    throw new Error(errorObj.error || 'Failed to save preset');
                }
                closeModal();
                await loadPresets();
            } catch (err) {
                alert(`Error: ${err.message}`);
            } finally {
                if (window.Obsidianscout) {
                    Obsidianscout.setButtonLoading(submitBtn, false);
                }
            }
        });

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const me = await Obsidianscout.requireAuth();
            if (!me) return;
            await loadPresets();
        });
    </script>
</body>
</html>
