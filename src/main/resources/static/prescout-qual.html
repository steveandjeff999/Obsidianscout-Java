<!doctype html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/obsidian/obsidian-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/obsidian/obsidian-512.png" />
    <link rel="apple-touch-icon" href="/assets/images/obsidian/obsidian-192.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ObsidianScout | Qualitative Prescout</title>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="manifest" href="/manifest.json" />
</head>
<body data-page="prescout-qual">
    <script>
        (function() {
            try {
                const saved = localStorage.getItem("obsidian-theme") || "light";
                if (saved === "dark") {
                    document.body.classList.add("theme-dark");
                }
            } catch (e) {
                console.warn("Theme storage access failed:", e);
            }
        })();
    </script>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="app-shell">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="card">
                <h1 data-i18n="prescout-qual.qualitative_prescouting">Qualitative Prescouting</h1>
                <div class="split mb-18">
                    <div class="field">
                        <label for="event-code-input" data-i18n="prescout-pit.event_code">Event Code</label>
                        <input id="event-code-input" type="text" data-i18n-placeholder="prescout-pit.placeholder_eg_2024micmp" placeholder="e.g. prescout or 2024micmp" style="min-width: 140px;" />
                    </div>
                    <div class="field">
                        <label for="team-input" data-i18n="all-data.team">Team Number</label>
                        <input id="team-input" type="number" min="1" placeholder="e.g. 254" />
                    </div>
                    <div class="field">
                        <label for="match-input" data-i18n="matches.match">Match Number</label>
                        <input id="match-input" type="number" min="1" placeholder="Auto-generated" />
                    </div>
                    <div class="field">
                        <label data-i18n="dashboard.timezone">Timezone</label>
                        <div id="timezone-badge" class="badge">--</div>
                    </div>
                </div>

                <form id="qual-scouting-form" class="form-grid">
                    <div id="form-blocked" class="notice">Enter a team number to start scouting. Match number is automatically generated on save.</div>
                    <div id="form-fields" class="form-grid hidden"></div>

                    <div class="row gap-12 wrap hidden">
                        <button id="qual-submit" class="btn" type="submit" disabled data-i18n="scout.save_entry">Save entry</button>
                        <button id="qual-save-offline" class="btn secondary" type="button" disabled data-i18n="scout.save_offline">Save Offline</button>
                        <button id="qual-export-json" class="btn secondary" type="button" disabled data-i18n="pit-scout.export_json">Export JSON</button>
                        <button id="qual-gen-qr" class="btn secondary" type="button" disabled data-i18n="pit-scout.generate_qr">Generate QR</button>
                        <button id="qual-clear" class="btn ghost" type="button" disabled data-i18n="scout.clear_form">Clear form</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script defer src="/js/common.js"></script>
    <script defer src="/vendor/qrcode.min.js"></script>
    <script type="module" src="/vendor/jabcodeJSLib.min.js"></script>
    <script defer src="/js/prescout-qual.js"></script>
</body>
</html>
