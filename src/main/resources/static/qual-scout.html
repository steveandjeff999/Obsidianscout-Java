<!doctype html>

<html lang="en">

<head>
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/obsidian/obsidian-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/obsidian/obsidian-512.png" />
    <link rel="apple-touch-icon" href="/assets/images/obsidian/obsidian-192.png" />

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ObsidianScout | Qualitative Scout</title>

    <link rel="stylesheet" href="/css/app.css" />

    <link rel="manifest" href="/manifest.json" />

    <style>
        .alliance-teams-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            align-items: start;
            width: 100%;
        }
        @media (max-width: 1024px) {
            .alliance-teams-grid {
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            }
        }
        @media (max-width: 600px) {
            .alliance-teams-grid {
                grid-template-columns: 1fr;
            }
        }
        .alliance-team-card {
            margin-bottom: 0 !important;
            width: 100%;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .alliance-team-card .form-grid {
            padding: 14px;
        }
    </style>
</head>

<body data-page="qual-scout">
        <script>
        (function() {
            try {
                const saved = localStorage.getItem("obsidian-theme") || "light";
                if (saved === "dark") {
                    document.body.classList.add("theme-dark");
                }
            } catch (e) {
                console.warn("Theme storage access failed:", e);
            }
        })();
    </script>

    <div class="orb orb-1"></div>

    <div class="orb orb-3"></div>



    <div class="app-shell">

        <aside class="sidebar"></aside>



        <main class="main-content">

            <div class="card">

                <h1 data-i18n="qual_scout.title">Qualitative scouting form</h1>

                <p class="notice" data-i18n="qual-scout.pick_event_team_and_match_then">Pick event, team, and match, then capture observations, ratings, and notes from the qualitative config.</p>

                <div class="field mb-18">
                    <label data-i18n="qual_scout.scouting_scope">Scouting Target</label>
                    <div class="row gap-8 wrap" id="scope-selector-container">
                        <button type="button" class="btn scope-btn active" data-scope="team" id="scope-btn-team">
                            <span data-i18n="qual_scout.scope_single_team">Single Team</span>
                        </button>
                        <button type="button" class="btn secondary scope-btn" data-scope="red" id="scope-btn-red" style="border-color: rgba(239, 68, 68, 0.6); color: #f87171;">
                            <span data-i18n="qual_scout.scope_red_alliance">🔴 Red Alliance</span>
                        </button>
                        <button type="button" class="btn secondary scope-btn" data-scope="blue" id="scope-btn-blue" style="border-color: rgba(59, 130, 246, 0.6); color: #60a5fa;">
                            <span data-i18n="qual_scout.scope_blue_alliance">🔵 Blue Alliance</span>
                        </button>
                        <button type="button" class="btn secondary scope-btn" data-scope="both" id="scope-btn-both" style="border-color: rgba(168, 85, 247, 0.6); color: #c084fc;">
                            <span data-i18n="qual_scout.scope_both_alliances">🟣 Both Alliances</span>
                        </button>
                    </div>
                </div>

                <div class="split mb-18">

                    <div class="field">

                        <label data-i18n="events.event">Event</label>

                        <div id="event-badge" class="badge"></div>

                    </div>

                    <div class="field" id="match-field-container">

                        <label for="match-select" data-i18n="matches.match">Match</label>

                        <select id="match-select" class="select-wide"></select>

                    </div>

                    <div class="field" id="team-field-container">

                        <label for="team-select" data-i18n="all-data.team">Team</label>

                        <select id="team-select"></select>

                    </div>

                    <div class="field">

                        <label data-i18n="dashboard.timezone">Timezone</label>

                        <div id="timezone-badge" class="badge"></div>

                    </div>

                </div>


                <form id="scouting-form" class="form-grid">

                    <div id="form-blocked" class="notice" data-i18n="qual-scout.select_a_team_and_match_to_sta">Select a team and match to start qualitative scouting.</div>

                    <div id="form-fields" class="form-grid hidden"></div>

                    <div class="row gap-12 wrap hidden">

                        <button id="scout-submit" class="btn" type="submit" data-i18n="qual_scout.save_entry">Save entry</button>

                        <button id="scout-save-offline-btn" class="btn secondary" type="button" data-i18n="qual_scout.save_offline">Save Offline</button>

                        <button id="scout-export-json" class="btn secondary" type="button" data-i18n="pit-scout.export_json">Export JSON</button>

                        <button id="scout-gen-qr" class="btn secondary" type="button" data-i18n="pit-scout.generate_qr">Generate QR</button>

                        <button id="scout-clear" class="btn ghost" type="button" data-i18n="qual_scout.clear_form">Clear form</button>

                    </div>

                </form>

            </div>



                <div class="row gap-12 wrap mt-18">

                    <a class="btn ghost" href="/qual-data" data-i18n="qual-scout.open_qualitative_rankings">Open qualitative rankings</a>

                </div>

        </main>

    </div>



    <script type="module" src="/js/common.js"></script>

    <script defer src="/vendor/qrcode.min.js"></script>
    <script type="module" src="/vendor/jabcodeJSLib.min.js"></script>

    <script defer src="/js/qual-scout.js"></script>

</body>

</html>
