<!doctype html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/obsidian/obsidian-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/obsidian/obsidian-512.png" />
    <link rel="apple-touch-icon" href="/assets/images/obsidian/obsidian-192.png" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ObsidianScout | Shared Links Manager</title>

    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/share-modal.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="manifest" href="/manifest.json" />
</head>

<body data-page="shared-links">
    <script>
        (function() {
            try {
                const saved = localStorage.getItem("obsidian-theme") || "light";
                if (saved === "dark") {
                    document.body.classList.add("theme-dark");
                }
            } catch (e) {
                console.warn("Theme storage access failed:", e);
            }
        })();
    </script>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="app-shell">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="card">
                <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
                    <div>
                        <h1 style="margin: 0; display: flex; align-items: center; gap: 10px;">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent, #6366f1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>
                            <span data-i18n="shares.title">Shared Links</span>
                        </h1>
                        <p class="notice mt-6" style="margin: 0;" data-i18n="shares.subtitle">Manage, monitor, and revoke shared data links created by your team.</p>
                    </div>
                    <button class="btn ghost" id="refresh-shares-btn" type="button">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:middle; margin-right:4px;"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
                        <span data-i18n="my_assignments.refresh">Refresh</span>
                    </button>
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="metrics mt-20" id="shares-stats-bar">
                <div class="card metric-card">
                    <span class="metric-label" data-i18n="shares.active_links">Active Links</span>
                    <strong class="metric-value" id="stat-active-count">0</strong>
                </div>
                <div class="card metric-card">
                    <span class="metric-label" data-i18n="shares.total_views">Total Views</span>
                    <strong class="metric-value" id="stat-views-count">0</strong>
                </div>
                <div class="card metric-card">
                    <span class="metric-label" data-i18n="shares.expired_links">Expired</span>
                    <strong class="metric-value" id="stat-expired-count">0</strong>
                </div>
                <div class="card metric-card">
                    <span class="metric-label" data-i18n="shares.revoked_links">Revoked</span>
                    <strong class="metric-value" id="stat-revoked-count">0</strong>
                </div>
            </div>

            <!-- Filter Controls -->
            <div class="card mt-20">
                <div class="form-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; align-items: end;">
                    <div class="field">
                        <label for="shares-search-input" data-i18n="shares.search_placeholder">Search Title or Creator</label>
                        <input type="text" id="shares-search-input" class="share-input" placeholder="Filter links..." data-i18n-placeholder="shares.search_placeholder" />
                    </div>
                    <div class="field">
                        <label for="shares-status-filter" data-i18n="shares.filter_all_status">Status Filter</label>
                        <select id="shares-status-filter" class="share-select">
                            <option value="all" data-i18n="shares.filter_all_status">All Statuses</option>
                            <option value="active" data-i18n="shares.status_active" selected>Active</option>
                            <option value="expired" data-i18n="shares.status_expired">Expired</option>
                            <option value="revoked" data-i18n="shares.status_revoked">Revoked</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="shares-type-filter" data-i18n="shares.filter_all_types">Resource Type</label>
                        <select id="shares-type-filter" class="share-select">
                            <option value="all" data-i18n="shares.filter_all_types">All Types</option>
                            <option value="graph" data-i18n="shares.type_graph">Graphs</option>
                            <option value="predictor" data-i18n="shares.type_predictor">Predictor</option>
                            <option value="all_data" data-i18n="shares.type_all_data">All Data</option>
                            <option value="custom_analytics" data-i18n="shares.type_custom_analytics">Custom Analytics</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Links Table -->
            <div class="card mt-20">
                <div class="shares-table-container">
                    <table class="shares-table" id="shares-list-table">
                        <thead>
                            <tr>
                                <th data-i18n="shares.th_title">Title / Details</th>
                                <th data-i18n="shares.th_type">Type</th>
                                <th data-i18n="shares.th_scope">Scope</th>
                                <th data-i18n="shares.th_views">Views</th>
                                <th data-i18n="shares.th_created_by">Created By</th>
                                <th data-i18n="shares.th_expires">Expires</th>
                                <th data-i18n="shares.th_status">Status</th>
                                <th style="text-align: right;" data-i18n="shares.th_actions">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="shares-table-body">
                            <tr>
                                <td colspan="8" style="text-align: center; padding: 40px; color: var(--muted);">
                                    <i class="fas fa-spinner fa-spin"></i> <span data-i18n="shares.loading">Loading shared links...</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- QR Code Popup Dialog -->
    <div class="share-modal-overlay" id="qr-dialog-overlay">
        <div class="share-modal-dialog" style="max-width: 400px; text-align: center;">
            <div class="share-modal-header">
                <h3 class="share-modal-title"><i class="fas fa-qrcode"></i> <span data-i18n="shares.view_qr">View QR Code</span></h3>
                <button class="share-modal-close" id="qr-dialog-close">&times;</button>
            </div>
            <div class="share-modal-body">
                <div id="dialog-qr-render" class="share-qr-container"></div>
                <p id="dialog-qr-title" style="font-weight: 600; margin: 0;"></p>
                <input type="text" id="dialog-qr-url" class="share-input mt-12" readonly style="font-size: 0.85rem;" />
            </div>
            <div class="share-modal-footer">
                <button class="btn primary" id="dialog-qr-copy-btn" type="button"><i class="fas fa-copy"></i> <span data-i18n="shares.copy_link">Copy Link</span></button>
            </div>
        </div>
    </div>

    <script type="module" src="/js/common.js"></script>
    <script defer src="/vendor/qrcode.min.js"></script>
    <script defer src="/js/shared-links.js"></script>
</body>
</html>
