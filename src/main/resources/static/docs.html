<!doctype html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/obsidian/obsidian-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/obsidian/obsidian-512.png" />
    <link rel="apple-touch-icon" href="/assets/images/obsidian/obsidian-192.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ObsidianScout | Documentation</title>
    <link rel="stylesheet" href="/css/app.css" />
    <style>
        /* Custom styles for documentation view */
        .docs-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
            margin-top: 20px;
            align-items: start;
        }
        .docs-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: sticky;
            top: 20px;
        }
        .docs-menu-item {
            padding: 14px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--ink);
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            outline: none;
            box-shadow: var(--shadow-sm);
        }
        .docs-menu-item:hover {
            background: var(--surface-2);
            color: var(--ink);
            border-color: var(--border-focus);
            transform: translateX(4px);
        }
        .docs-menu-item.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
            transform: translateX(6px);
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        .docs-content {
            min-height: 550px;
            padding: 32px;
        }
        /* Markdown rendering styles */
        .markdown-body {
            line-height: 1.62;
            font-size: 15.5px;
            color: var(--ink);
        }
        .markdown-body h1 {
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--ink);
        }
        .markdown-body h2 {
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 8px;
            margin-top: 36px;
            margin-bottom: 16px;
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--accent);
        }
        .markdown-body h3 {
            margin-top: 28px;
            margin-bottom: 12px;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--ink);
        }
        .markdown-body p, .markdown-body ul, .markdown-body ol {
            margin-bottom: 20px;
            color: var(--ink);
        }
        .markdown-body ul, .markdown-body ol {
            padding-left: 24px;
        }
        .markdown-body li {
            margin-bottom: 8px;
            color: var(--ink);
        }
        .markdown-body code {
            font-family: Consolas, Monaco, 'Andale Mono', monospace;
            background: var(--surface-2);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            color: var(--accent);
            border: 1px solid var(--border-subtle);
        }
        .markdown-body pre {
            background: var(--surface-2);
            padding: 18px;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }
        .markdown-body pre code {
            background: none;
            padding: 0;
            font-size: 0.9em;
            color: var(--ink);
            border: none;
        }
        .markdown-body blockquote {
            border-left: 4px solid var(--accent);
            padding: 12px 20px;
            margin: 0 0 24px 0;
            background: var(--surface-2);
            border-radius: 0 8px 8px 0;
            color: var(--muted);
            font-style: italic;
        }
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 24px;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid var(--border);
            padding: 10px 14px;
            text-align: left;
            color: var(--ink);
        }
        .markdown-body th {
            background: var(--surface-2);
            font-weight: 600;
        }
        .markdown-body hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 32px 0;
        }
        
        /* Alert banners in Markdown rendering (resembling GitHub alerts) */
        .markdown-body blockquote p:first-child {
            margin-top: 0;
        }
        .markdown-body blockquote p:last-child {
            margin-bottom: 0;
        }
        
        @media (max-width: 900px) {
            .docs-container {
                grid-template-columns: 1fr;
            }
            .docs-menu {
                position: static;
            }
        }

        /* Public Guest Header Styles */
        .docs-public-header {
            display: none;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            align-items: center;
            justify-content: space-between;
        }

        body.theme-dark .docs-public-header {
            background: rgba(11, 15, 25, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        body.is-guest .docs-public-header {
            display: flex;
        }

        body.is-guest .sidebar {
            display: none !important;
        }

        body.is-guest .mobile-topbar {
            display: none !important;
        }

        body.is-guest .sidebar-overlay {
            display: none !important;
        }

        body.is-guest .app-shell {
            display: block;
        }

        body.is-guest .main-content {
            max-width: 1240px;
            margin: 0 auto;
            padding: 24px 24px 80px;
        }

        @media (max-width: 768px) {
            .docs-public-header {
                padding: 10px 16px;
                gap: 12px;
            }
            .header-nav {
                display: none;
            }
            .header-brand span {
                font-size: 1rem;
            }
            .btn-signin, .btn-primary-action {
                padding: 6px 12px;
                font-size: 12.5px;
            }
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--ink);
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.01em;
        }

        .header-brand img {
            width: 28px;
            height: 28px;
            border-radius: 6px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-nav a.nav-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.15s ease;
        }

        .header-nav a.nav-link:hover,
        .header-nav a.nav-link.active {
            color: var(--ink);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-signin {
            color: var(--ink);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            transition: all 0.15s ease;
        }

        .btn-signin:hover {
            background: var(--surface-3);
            color: var(--ink);
            border-color: var(--border-focus);
        }

        .btn-primary-action {
            background: var(--accent);
            color: #ffffff;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 10px var(--accent-glow);
        }

        .btn-primary-action:hover {
            background: #1d4ed8;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--ink);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 0;
            flex-shrink: 0;
        }

        .btn-theme-toggle:hover {
            background: var(--surface-3);
            border-color: var(--border-focus);
        }
    </style>
    <link rel="manifest" href="/manifest.json" />
</head>
<body data-page="docs" class="is-guest">
    <script>
        (function() {
            try {
                const saved = localStorage.getItem("obsidian-theme") || "light";
                if (saved === "dark") {
                    document.body.classList.add("theme-dark");
                }
                const cachedUser = localStorage.getItem("cache:/api/auth/me");
                if (cachedUser) {
                    document.body.classList.remove("is-guest");
                }
            } catch (e) {
                console.warn("Theme/auth storage access failed:", e);
            }
        })();
    </script>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Public Header shown when user is not signed in -->
    <header class="docs-public-header" id="docs-public-header">
        <a href="/" class="header-brand">
            <img src="/assets/images/obsidian/obsidian-192.png" alt="ObsidianScout Logo" />
            <span>ObsidianScout</span>
        </a>
        <nav class="header-nav">
            <a href="/#platforms" class="nav-link">Platforms</a>
            <a href="/#abilities" class="nav-link">Capabilities</a>
            <a href="/#roles" class="nav-link">Roles</a>
            <a href="/docs" class="nav-link active">Docs</a>
        </nav>
        <div class="header-actions">
            <button class="btn-theme-toggle" data-action="toggle-theme" type="button" aria-label="Toggle Theme">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
            <a href="/login" class="btn-signin">Sign In</a>
            <a href="/login?mode=register" class="btn-primary-action">Get Started</a>
        </div>
    </header>

    <div class="app-shell">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="card">
                <h1 data-i18n="docs.title">Documentation</h1>
                <p class="notice" data-i18n="docs.notice">Learn how to configure, run, and use the ObsidianScout scouting system.</p>
            </div>

            <div class="docs-container">
                <nav class="docs-menu" id="docs-menu">
                    <div style="padding: 10px; text-align: center; color: var(--text-muted, #777);" data-i18n="docs.loading">Loading articles...</div>
                </nav>
                <div class="card docs-content">
                    <article class="markdown-body" id="docs-viewport">
                        <h2 style="border: none;" data-i18n="docs.select_article">Select an article from the menu to start reading.</h2>
                    </article>
                </div>
            </div>
        </main>
    </div>

    <!-- Include local marked.js to parse markdown on the client side -->
    <script src="/vendor/marked.min.js"></script>
    <script type="module" src="/js/common.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            if (window.Obsidianscout && typeof Obsidianscout.initTheme === 'function') {
                Obsidianscout.initTheme();
            }

            // Check authentication status without blocking guest access
            let me = null;
            try {
                if (window.Obsidianscout && typeof Obsidianscout.checkLoginStatus === 'function') {
                    const loggedIn = await Obsidianscout.checkLoginStatus();
                    if (loggedIn) {
                        me = await Obsidianscout.getMe();
                    }
                }
            } catch (e) {
                console.warn("Auth status check error:", e);
            }

            if (window.Obsidianscout && typeof Obsidianscout.wireThemeToggle === 'function') {
                Obsidianscout.wireThemeToggle();
            }

            if (me) {
                document.body.classList.remove("is-guest");
                if (window.Obsidianscout) {
                    Obsidianscout.setUserBadge(me);
                    Obsidianscout.setActiveNav();
                    Obsidianscout.adjustNavForRole(me);
                    Obsidianscout.wireLogout();
                }
            } else {
                document.body.classList.add("is-guest");
            }

            const menuContainer = document.getElementById("docs-menu");
            const viewport = document.getElementById("docs-viewport");
            let activeFilename = null;

            const getLang = () => localStorage.getItem('obsidianscout:lang') || 'en';

            function loadDocsList(lang) {
                menuContainer.innerHTML = `<div style="padding: 10px; text-align: center; color: var(--text-muted, #777);">${translate('docs.loading', 'Loading articles...')}</div>`;
                
                fetch(`/api/docs?lang=${lang}`)
                    .then(res => {
                        if (!res.ok) throw new Error("Failed to load documents list");
                        return res.json();
                    })
                    .then(files => {
                        if (files.length === 0) {
                            menuContainer.innerHTML = `<div style="padding: 10px; color: var(--text-muted);">${translate('docs.empty', 'No documentation files found.')}</div>`;
                            return;
                        }
                        menuContainer.innerHTML = "";
                        files.forEach((file, index) => {
                            const btn = document.createElement("button");
                            btn.className = "docs-menu-item";
                            btn.textContent = file.title;
                            btn.dataset.filename = file.filename;
                            btn.addEventListener("click", () => {
                                activeFilename = file.filename;
                                loadArticle(file.filename, btn, lang);
                            });
                            menuContainer.appendChild(btn);

                            // Load active or default article
                            if (activeFilename === file.filename || (!activeFilename && index === 0)) {
                                activeFilename = file.filename;
                                loadArticle(file.filename, btn, lang);
                            }
                        });
                    })
                    .catch(err => {
                        console.error(err);
                        menuContainer.innerHTML = `<div style="padding: 10px; color: var(--danger);">${translate('docs.error_loading', 'Failed to load menu.')}</div>`;
                    });
            }

            function loadArticle(filename, buttonEl, lang) {
                // Update active states
                document.querySelectorAll(".docs-menu-item").forEach(el => el.classList.remove("active"));
                if (buttonEl) buttonEl.classList.add("active");

                viewport.innerHTML = `<h2>${translate('docs.loading_article', 'Loading article...')}</h2>`;

                fetch(`/api/docs/${filename}?lang=${lang}`)
                    .then(res => {
                        if (!res.ok) throw new Error("Failed to load article content");
                        return res.json();
                    })
                    .then(data => {
                        if (window.marked && typeof marked.parse === "function") {
                            viewport.innerHTML = marked.parse(data.content);
                        } else {
                            viewport.innerHTML = `<pre>${data.content}</pre>`;
                        }
                    })
                    .catch(err => {
                        viewport.innerHTML = `<h2 style="color: var(--danger);">${translate('docs.error_loading', 'Error loading documentation')}</h2><p>${err.message}</p>`;
                    });
            }

            function translate(key, fallback) {
                if (window.Obsidianscout && typeof window.Obsidianscout.t === 'function') {
                    return window.Obsidianscout.t(key, fallback);
                }
                return fallback;
            }

            // Listen for language changes from sidebar dropdown
            window.addEventListener('obsidianscout:languagechange', (e) => {
                const lang = e.detail.lang || 'en';
                // Reload list (keeps active article selected but translates it)
                loadDocsList(lang);
            });

            // Initial load
            const currentLang = getLang();
            loadDocsList(currentLang);
        });
    </script>
</body>
</html>
