<!doctype html>

<html lang="en">

<head>
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/obsidian/obsidian-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/obsidian/obsidian-512.png" />
    <link rel="apple-touch-icon" href="/assets/images/obsidian/obsidian-192.png" />

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ObsidianScout | Dashboard</title>

    <link rel="stylesheet" href="/css/app.css" />

    <link rel="manifest" href="/manifest.json" />
</head>

<body data-page="dashboard">
        <script>
        (function() {
            try {
                const saved = localStorage.getItem("obsidian-theme") || "light";
                if (saved === "dark") {
                    document.body.classList.add("theme-dark");
                }
            } catch (e) {
                console.warn("Theme storage access failed:", e);
            }
        })();
    </script>

    <div class="orb orb-1"></div>

    <div class="orb orb-2"></div>



    <div class="app-shell">

        <aside class="sidebar"></aside>



        <main class="main-content">

            <div class="card">

                <h1 data-i18n="dashboard.title">Dashboard</h1>

                <p class="notice" data-i18n="dashboard.notice">Track scouting progress, sync status, and event context.</p>

            </div>



            <div class="metrics mt-20">

                <div class="card">

                    <h3 data-i18n="dashboard.entries">Entries</h3>

                    <div id="summary-entries" class="metric-value">0</div>

                </div>

                <div class="card">

                    <h3 data-i18n="dashboard.events">Events</h3>

                    <div id="summary-events" class="metric-value">0</div>

                </div>

                <div class="card">

                    <h3 data-i18n="dashboard.teams">Teams</h3>

                    <div id="summary-teams" class="metric-value">0</div>

                </div>

                <div class="card">

                    <h3 data-i18n="dashboard.matches">Matches</h3>

                    <div id="summary-matches" class="metric-value">0</div>

                </div>

            </div>



            <div class="split mt-24">

                <div class="card">

                    <h2 data-i18n="dashboard.event_context">Event context</h2>

                    <p class="notice" data-i18n="dashboard.event_context_notice">Season and event settings are used for API sync and match times.</p>

                    <div class="form-grid">

                        <div class="field">

                            <label data-i18n="dashboard.season">Season</label>

                            <div id="summary-year"></div>

                        </div>

                        <div class="field">

                            <label data-i18n="dashboard.event_key">Event key</label>

                            <div id="summary-event"></div>

                        </div>

                        <div class="field">

                            <label data-i18n="dashboard.timezone">Timezone</label>

                            <div id="summary-timezone"></div>

                        </div>

                    </div>

                </div>

                <div class="card">

                    <h2 data-i18n="dashboard.quick_sync">Quick sync</h2>

                    <p class="notice" data-i18n="dashboard.quick_sync_notice">Teams and matches auto-sync every 7.5 minutes while the server is running.</p>

                    <p id="sync-status" class="notice mt-8"></p>

                    <div class="row gap-12 wrap mt-12">

                        <button class="btn" id="sync-all" type="button" data-i18n="dashboard.sync_data">Sync data</button>

                    </div>

                </div>

            </div>

        </main>

    </div>



    <script defer src="/js/common.js"></script>

    <script defer src="/js/dashboard.js"></script>

</body>

</html>
