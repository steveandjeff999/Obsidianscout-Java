<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Bootstrapping - ObsidianScout</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at center, #111827, #030712);
            color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 3rem;
            border-radius: 24px;
            text-align: center;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .spinner {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
        }
        .spinner-circle {
            width: 100%;
            height: 100%;
            border: 4px solid rgba(139, 92, 246, 0.1);
            border-top-color: #8b5cf6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .spinner-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
            filter: blur(8px);
            opacity: 0.7;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-weight: 800;
            font-size: 2.25rem;
            margin: 0 0 1rem;
            background: linear-gradient(135deg, #ffffff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
        }
        p {
            color: #9ca3af;
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0 0 2rem;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(139, 92, 246, 0.15);
            color: #c084fc;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
    </style>
    <script>
        async function checkDatabaseStatus() {
            try {
                const response = await fetch('/api/cluster/status');
                if (response.ok) {
                    const data = await response.json();
                    if (data.dbReady) {
                        window.location.reload();
                    }
                }
            } catch (e) {
                // Ignore transient network errors
            }
            setTimeout(checkDatabaseStatus, 2000);
        }
        window.addEventListener('DOMContentLoaded', checkDatabaseStatus);
    </script>
</head>
<body>
    <div class="card">
        <div class="spinner">
            <div class="spinner-circle"></div>
            <div class="spinner-glow"></div>
        </div>
        <h1>Setting Up Database</h1>
        <p>ObsidianScout is establishing a secure connection to the database cluster. This page will refresh automatically as soon as the cluster is ready.</p>
        <div class="status-badge">Bootstrapping...</div>
    </div>
</body>
</html>
