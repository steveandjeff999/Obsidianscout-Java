<!doctype html>

<html lang="en">

<head>
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/obsidian/obsidian-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/obsidian/obsidian-512.png" />
    <link rel="apple-touch-icon" href="/assets/images/obsidian/obsidian-192.png" />

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ObsidianScout | Analytics</title>

    <link rel="stylesheet" href="/css/app.css" />

    <link rel="manifest" href="/manifest.json" />
</head>

<body data-page="analytics">
    <script>
        (function() {
            try {
                const saved = localStorage.getItem("obsidian-theme") || "light";
                if (saved === "dark") {
                    document.body.classList.add("theme-dark");
                }
            } catch (e) {
                console.warn("Theme storage access failed:", e);
            }
        })();
    </script>

    <div class="orb orb-1"></div>

    <div class="orb orb-3"></div>

    <div class="app-shell">

        <aside class="sidebar"></aside>

        <main class="main-content">

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                    <div>
                        <h1 data-i18n="analytics.title">Analytics from config</h1>
                        <p class="notice" data-i18n="analytics.notice" style="margin-top: 4px;">Widgets are generated from the analytics section of the config JSON.</p>
                    </div>
                    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                        <label class="inline-control" style="cursor: pointer; user-select: none; font-size: 14px; font-weight: 500;">
                            <input type="checkbox" id="toggle-prescout" style="cursor: pointer;" />
                            <span data-i18n="analytics.include_prescout">Include Prescouting Data</span>
                        </label>
                        <button id="btn-refresh-analytics" class="btn btn-secondary" style="padding: 8px 14px; display: inline-flex; align-items: center; gap: 6px;">
                            <i class="fa-solid fa-arrows-rotate"></i>
                            <span data-i18n="analytics.refresh">Refresh</span>
                        </button>
                    </div>
                </div>
            </div>

            <div id="analytics-grid" class="metrics mt-20"></div>

        </main>

    </div>

    <script type="module" src="/js/common.js"></script>

    <script defer src="/js/analytics.js"></script>

</body>

</html>
